name: 버그 수정
description: 재현 가능한 오류나 회귀를 보고합니다.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: 실제 계약서, 개인정보, API 키, 서명 링크는 재현 자료에 포함하지 마세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 잘못된 동작과 사용자 영향을 간결하게 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 안전한 재현 자료
      description: 가상 데이터, 오류 코드, 민감정보를 제거한 로그나 화면을 첨부해 주세요.
  - type: checkboxes
    id: surfaces
    attributes:
      label: 영향 범위
      options:
        - label: Frontend
        - label: API
        - label: OpenAPI 또는 공유 스키마
        - label: DB 또는 상태 전이
        - label: 외부 연동
        - label: Fixtures 또는 평가
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 데모 경로 차단
        - 주요 기능 오동작
        - 부분 기능 또는 예외 상황
        - 경미한 문제
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수정 완료 조건
      value: |
        - [ ] 재현 테스트가 추가되고 통과한다.
        - [ ] 관련 회귀 테스트가 통과한다.
    validations:
      required: true
