name: 기능 개발
description: 새로운 제품 기능이나 기존 기능 확장을 제안합니다.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: 실제 계약서, 개인정보, API 키, 서명 링크는 이슈에 포함하지 마세요.
  - type: textarea
    id: summary
    attributes:
      label: 작업 요약
      description: 무엇을 누구를 위해 변경하는지 간결하게 작성해 주세요.
      placeholder: 사용자가 수정 계약서의 변경점을 근거와 함께 확인할 수 있게 한다.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 배경과 문제
      description: 현재 동작과 해결하려는 문제를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함 범위와 제외 범위를 구분해 주세요.
      value: |
        포함:
        -

        제외:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 테스트하거나 관찰할 수 있는 조건으로 작성해 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: 영향 범위
      options:
        - label: Frontend
        - label: API
        - label: OpenAPI 또는 공유 스키마
        - label: DB 또는 상태 전이
        - label: 외부 연동
        - label: Fixtures 또는 평가
        - label: 문서만 변경
  - type: dropdown
    id: lifecycle
    attributes:
      label: P0 생애주기 영향
      options:
        - 영향 없음
        - 업로드·이해조건
        - 추출·검토
        - 조정·상대방 응답
        - 수정 계약서 검증
        - 전자서명
        - 의무·증빙 확인
        - 만료·갱신
        - 여러 단계에 영향
    validations:
      required: true
  - type: dropdown
    id: contract_impact
    attributes:
      label: API·데이터·상태 계약 변경
      options:
        - 없음
        - 있음
        - 확인 필요
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 검증 계획
      description: 추가하거나 실행할 테스트와 수동 확인 항목을 작성해 주세요.
    validations:
      required: true
