[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansim-contract-api"
version = "0.1.0"
description = "안심홍보계약 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "pypdf>=6.14,<7.0",
  "reportlab>=4.2,<5.0",
  "python-multipart>=0.0.20,<1.0",
  "supabase>=2.17,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
