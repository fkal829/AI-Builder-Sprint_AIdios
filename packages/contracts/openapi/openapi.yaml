      operationId: getAgreement
      tags: [agreements]
      description: 이전 버전에서 생성한 합의서의 구조화된 공개 내용을 반환한다. 새 P0 흐름에서는 호출하지 않으며 private Storage의 PDF 경로와 무결성 메타데이터는 반환하지 않는다.
      responses:
