openapi: 3.1.0
info:
  title: 안심홍보계약 API
  version: 0.2.0
  description: P0 프런트엔드와 FastAPI가 공유하는 HTTP 계약
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: API 상태 확인
      operationId: healthCheck
      tags: [health]
      security: []
      responses:
        "200":
          description: API 상태 확인
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /contracts:
    get:
      summary: 계약 목록 조회
      operationId: listContracts
      tags: [contracts]
      description: 만료일이 가까운 계약부터 정렬하며, 만료일이 없으면 마지막에 둔다. 같은 만료일은 id 오름차순으로 정렬한다.
      parameters:
        - name: renewal_due_within_days
          in: query
          schema: {type: integer, minimum: 1, maximum: 365}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/ContractStatus"}
      responses:
        "200":
          description: 소유자의 계약 목록과 만료 D-day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 계약 생성
      operationId: createContract
      tags: [contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCreate"
      responses:
        "201":
          description: 계약 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /contracts/{contract_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 계약 상세 조회
      operationId: getContract
      tags: [contracts]
      responses:
        "200":
          description: 계약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /contracts/{contract_id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 계약 감사 타임라인 조회
      operationId: getContractTimeline
      tags: [contracts]
      description: created_at 오름차순, id 오름차순으로 정렬한 append-only 감사 타임라인을 반환한다.
      responses:
        "200":
          description: 민감정보를 제외한 계약 감사 타임라인
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /contracts/{contract_id}/documents:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 계약 문서 업로드
      operationId: uploadContractDocument
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: "#/components/schemas/DocumentType"
      responses:
        "201":
          description: 문서 업로드 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/understood-terms:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    put:
      summary: 사용자가 이해한 계약 조건 저장
      operationId: saveUnderstoodTerms
      tags: [contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnderstoodTerm"
      responses:
        "200":
          description: 사용자가 이해한 다섯 조건 저장
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnderstoodTermResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/analysis:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 계약 분석 시작
      operationId: startAnalysis
      tags: [analysis]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStartRequest"
      responses:
        "202":
          description: 분석 작업 접수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisTaskResponse"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "503":
          $ref: "#/components/responses/ExternalServiceUnavailable"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    get:
      summary: 계약 분석 상태와 결과 조회
      operationId: getAnalysis
      tags: [analysis]
      responses:
        "200":
          description: 처리 중·완료·실패를 포함한 분석 작업 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisTaskResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract_id}/review-items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: 검토 항목 선택 수정
      operationId: updateReviewItem
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewItemUpdate"
      responses:
        "200":
          description: 사용자 선택 반영
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/adjustment-requests:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 조정 요청 초안 생성
      operationId: createAdjustmentRequest
      tags: [adjustments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequestCreate"
      responses:
        "201":
          description: 사용자가 확인할 조정 요청 초안 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
  /contracts/{contract_id}/adjustment-requests/{adjustment_request_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/AdjustmentRequestId"
    get:
      summary: 소유자용 조정 요청 상세 조회
      operationId: getOwnerAdjustmentRequest
      tags: [adjustments]
      responses:
        "200":
          description: 대행사 응답과 역제안 비교를 포함한 소유자용 조정 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAdjustmentDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /contracts/{contract_id}/adjustment-requests/{adjustment_request_id}/send:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/AdjustmentRequestId"
    post:
      summary: 조정 요청 공개 링크 활성화
      operationId: sendAdjustmentRequest
      tags: [adjustments]
      description: 사용자 미리보기 확인 후 공개 링크를 활성화하고 DRAFT에서 SENT로 전환한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplicitConfirmation"
      responses:
        "200":
          description: 공개 링크 활성화 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestSentResponse"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /public/adjustment-requests/{token}:
    parameters:
      - $ref: "#/components/parameters/AdjustmentToken"
    get:
      summary: 공개 조정 요청 조회
      operationId: getPublicAdjustmentRequest
      tags: [public]
      security: []
      responses:
        "200":
          description: 대행사 공개 조정 요청
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdjustmentResponse"
        "410":
          $ref: "#/components/responses/PublicExpiredLink"
        "404": {$ref: "#/components/responses/PublicNotFound"}
  /public/adjustment-requests/{token}/responses:
    parameters:
      - $ref: "#/components/parameters/AdjustmentToken"
    post:
      summary: 대행사 조정 응답 제출
      operationId: submitAdjustmentResponses
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentResponsesSubmit"
      responses:
        "201":
          description: 전체 응답 제출 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubmissionResponse"
        "409":
          $ref: "#/components/responses/PublicInvalidTransition"
        "404": {$ref: "#/components/responses/PublicNotFound"}
        "410": {$ref: "#/components/responses/PublicExpiredLink"}
        "422": {$ref: "#/components/responses/PublicValidationError"}
  /contracts/{contract_id}/adjustment-confirmation:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 최종 조정 결과 확정
      operationId: confirmAdjustment
      tags: [adjustments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentConfirmation"
      responses:
        "200":
          description: 사용자가 응답을 검토하고 최종 합의 조건 확정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/agreement:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 변경·확인 합의서 생성
      operationId: createAgreement
      tags: [agreements]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: 최대 네 조항의 변경·확인 합의서 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
    get:
      summary: 변경·확인 합의서 조회
      operationId: getAgreement
      tags: [agreements]
      responses:
        "200":
          description: 현재 확정된 변경·확인 합의서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract_id}/signature-requests:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 모두싸인 서명 요청 생성
      operationId: createSignatureRequest
      tags: [signatures]
      description: 사용자의 명시적 확인 후에만 호출한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignatureRequestCreate"
      responses:
        "201":
          description: 모두싸인 서명 요청 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureResponse"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "502": {$ref: "#/components/responses/ModusignRequestFailed"}
  /contracts/{contract_id}/signature:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 전자서명 상태 조회
      operationId: getSignature
      tags: [signatures]
      responses:
        "200":
          description: 전자서명 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /contracts/{contract_id}/obligations:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 이행 항목 목록 조회
      operationId: listObligations
      tags: [obligations]
      description: due_date 오름차순, id 오름차순으로 정렬한다.
      responses:
        "200":
          description: 이행 항목 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObligationListResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      summary: 대표 산출물 이행 항목 생성
      operationId: createObligation
      tags: [obligations]
      description: P0 대표 산출물 한 건을 생성한다. 이미 대표 산출물이 있으면 409를 반환한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObligationCreate"
      responses:
        "201":
          description: 대표 산출물 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObligationResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/obligations/{obligation_id}/evidence-link:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/ObligationId"
    post:
      summary: 산출물 증빙 제출 링크 생성
      operationId: createObligationEvidenceLink
      tags: [obligations]
      description: 산출물 제출에만 사용할 수 있는 별도 scope의 만료형 공개 링크를 생성한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLinkCreate"
      responses:
        "201":
          description: 증빙 제출 링크 생성
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLinkResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /public/obligations/{token}/evidence:
    parameters:
      - $ref: "#/components/parameters/ObligationToken"
    post:
      summary: 산출물 증빙 제출
      operationId: submitObligationEvidence
      tags: [public, obligations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidence_url]
              properties:
                evidence_url:
                  type: string
                  format: uri
                  pattern: "^https?://"
                  maxLength: 2048
      responses:
        "200":
          description: 증빙 제출 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubmissionResponse"
        "404": {$ref: "#/components/responses/PublicNotFound"}
        "409": {$ref: "#/components/responses/PublicInvalidTransition"}
        "410": {$ref: "#/components/responses/PublicExpiredLink"}
        "422": {$ref: "#/components/responses/PublicValidationError"}
  /contracts/{contract_id}/obligations/{obligation_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/ObligationId"
    patch:
      summary: 산출물 증빙 검토
      operationId: reviewObligation
      tags: [obligations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, DISPUTED]
      responses:
        "200":
          description: 사용자 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObligationResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /dashboard:
    get:
      summary: 대시보드 조회
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: 소상공인 대시보드 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /webhooks/modusign:
    post:
      summary: 모두싸인 웹훅 수신
      operationId: receiveModusignWebhook
      tags: [webhooks]
      description: |
        모두싸인 웹훅 등록의 custom headers에 설정한 X-Modusign-Webhook-Secret을 검증한다.
        인증 성공 후 이벤트를 멱등하게 저장하고 즉시 204를 반환한다. 문서 상태 조회와
        계약 상태 전이는 응답 이후 비동기로 수행한다. 공식 payload에 이벤트 ID와 문서
        상태가 없으므로 event.type, document.id, payload hash를 중복 판단에 사용한다.
      security:
        - ModusignWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModusignWebhookEvent"
      responses:
        "204":
          description: 처리 완료 또는 이미 처리한 이벤트
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  headers:
    NoStore:
      description: 공개 토큰 응답 캐시 방지
      schema:
        type: string
        const: no-store
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 소유자 API용 인증 토큰. 인증 공급자와 발급 방식은 구현 환경에서 결정한다.
    ModusignWebhookSecret:
      type: apiKey
      in: header
      name: X-Modusign-Webhook-Secret
      description: 모두싸인 웹훅 등록 시 서버가 설정한 고정 비밀 헤더
  parameters:
    ContractId:
      name: contract_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdjustmentRequestId:
      name: adjustment_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ObligationId:
      name: obligation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdjustmentToken:
      name: token
      in: path
      required: true
      description: ADJUSTMENT_RESPONSE scope만 가진 만료형 토큰. 원문을 로그에 남기지 않는다.
      schema: {type: string, minLength: 32}
    ObligationToken:
      name: token
      in: path
      required: true
      description: OBLIGATION_EVIDENCE scope만 가진 만료형 토큰. 조정 API에 사용할 수 없다.
      schema: {type: string, minLength: 32}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        소유자·operation·resource 범위에서 중복 실행을 방지하는 UUID다. 같은 키와 같은
        요청은 최초 상태 코드와 응답을 재생하고, 같은 키에 다른 요청 본문을 보내면
        IDEMPOTENCY_CONFLICT를 반환한다.
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: 인증 실패 또는 유효하지 않은 공개 scope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InvalidTransition:
      description: 허용되지 않은 상태 전환 또는 중복 제출
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ExternalServiceUnavailable:
      description: 분석 작업을 시작할 수 없음
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ModusignRequestFailed:
      description: 모두싸인 서명 요청 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicNotFound:
      description: 공개 리소스를 찾을 수 없거나 토큰 scope가 일치하지 않음
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicValidationError:
      description: 공개 요청 입력 검증 실패
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicInvalidTransition:
      description: 허용되지 않은 상태 전환 또는 중복 제출
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicExpiredLink:
      description: 공개 링크 만료
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - DOCUMENT_PARSE_FAILED
            - ANALYSIS_SCHEMA_INVALID
            - ANALYSIS_START_FAILED
            - ADJUSTMENT_LINK_EXPIRED
            - OBLIGATION_LINK_EXPIRED
            - INVALID_STATUS_TRANSITION
            - MODUSIGN_REQUEST_FAILED
            - WEBHOOK_DUPLICATED
            - WEBHOOK_AUTH_FAILED
            - UNAUTHORIZED_ACCESS
            - ADJUSTMENT_TOKEN_SCOPE_INVALID
            - OBLIGATION_TOKEN_SCOPE_INVALID
            - IDEMPOTENCY_CONFLICT
            - NOT_FOUND
            - VALIDATION_ERROR
        message: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, error, requestId]
      properties:
        data: {type: "null"}
        error: {$ref: "#/components/schemas/ApiError"}
        requestId: {type: string, pattern: "^req_[a-f0-9]+$"}
    ContractStatus:
      type: string
      enum: [DRAFT, ANALYZING, REVIEW_REQUIRED, NEGOTIATING, READY_TO_SIGN, SIGNING, SIGNED, IN_PROGRESS, COMPLETED, RENEWAL_DUE]
    AdjustmentRequestStatus:
      type: string
      enum: [DRAFT, SENT, OPENED, RESPONDED, CONFIRMED, EXPIRED]
    InternalSignatureStatus:
      type: string
      enum: [REQUEST_READY, REQUESTING, SIGNING, COMPLETED, ABORTED, FAILED]
    ModusignDocumentStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ON_PROCESSING, ON_GOING, COMPLETED, ABORTED, PROCESSING_FAILED]
    ObligationStatus:
      type: string
      enum: [PENDING, SUBMITTED, APPROVED, DISPUTED]
    VerificationStatus:
      type: string
      enum: [VERIFIED, NOT_FOUND, MISSING_EVIDENCE, NEEDS_CHECK]
    AnalysisStatus:
      type: string
      enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
    ContractCreate:
      type: object
      additionalProperties: false
      required: [title, counterparty_name]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        counterparty_name: {type: string, minLength: 1, maxLength: 120}
    Contract:
      type: object
      additionalProperties: false
      required: [id, title, counterparty_name, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        counterparty_name: {type: string}
        status: {$ref: "#/components/schemas/ContractStatus"}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        termination_notice_date: {type: [string, "null"], format: date}
        renewal_type: {type: [string, "null"]}
        total_amount: {type: [integer, "null"], format: int64, minimum: 0}
        modusign_document_id: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContractResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Contract"}
    ContractListItem:
      type: object
      additionalProperties: false
      required: [id, title, counterparty_name, status, total_amount, end_date, expiry_d_day, termination_notice_d_day]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        counterparty_name: {type: string}
        status: {$ref: "#/components/schemas/ContractStatus"}
        total_amount: {type: [integer, "null"], format: int64, minimum: 0}
        end_date: {type: [string, "null"], format: date}
        expiry_d_day: {type: [integer, "null"]}
        termination_notice_d_day: {type: [integer, "null"]}
    ContractListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/ContractListItem"}
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, actor_type, created_at]
      properties:
        id: {type: string, format: uuid}
        event_type: {type: string}
        actor_type: {type: string, enum: [OWNER, AGENCY, SYSTEM]}
        summary: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    TimelineResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/AuditEvent"}
    DocumentType:
      type: string
      enum: [CONTRACT, PROPOSAL, ESTIMATE, MESSAGE]
    Document:
      type: object
      required: [id, contract_id, type, parse_status, created_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/DocumentType"}
        parse_status: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED]}
        created_at: {type: string, format: date-time}
    DocumentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Document"}
    UnderstoodTerm:
      type: object
      additionalProperties: false
      required: [duration_text, monthly_amount, total_amount, refund_text, termination_text, source_type]
      properties:
        duration_text: {type: string, minLength: 1}
        monthly_amount: {type: [integer, "null"], format: int64, minimum: 0}
        total_amount: {type: [integer, "null"], format: int64, minimum: 0}
        refund_text: {type: string, minLength: 1}
        termination_text: {type: string, minLength: 1}
        source_type:
          type: string
          enum: [USER_MEMORY, DOCUMENT, RECORDING]
    UnderstoodTermResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/UnderstoodTerm"}
    ExtractedField:
      type: string
      enum:
        - contract_party_owner
        - contract_party_agency
        - contract_start_date
        - contract_end_date
        - monthly_amount
        - contract_total_amount
        - payment_method
        - auto_renewal
        - termination_notice_date
        - early_termination_allowed
        - termination_penalty_rate
        - refund_condition
        - advertising_channel
        - content_type
        - content_quantity
        - posting_frequency
        - reporting_frequency
        - performance_guarantee
        - content_ownership
        - portrait_rights
        - facility_damage_liability
        - false_advertising_liability
    ExtractedValueType:
      type: string
      enum: [TEXT, DATE, MONEY_KRW, INTEGER, PERCENT, BOOLEAN]
    ExtractedTerm:
      type: object
      additionalProperties: false
      required: [field, value_type, value, source_page, source_text, confidence, verification_status]
      properties:
        field: {$ref: "#/components/schemas/ExtractedField"}
        value_type: {$ref: "#/components/schemas/ExtractedValueType"}
        value:
          description: value_type에 따라 문자열, ISO date, 원화 정수, 정수, 0~100 비율 또는 YES/NO/UNKNOWN
          anyOf:
            - {type: string}
            - {type: integer, format: int64}
            - {type: "null"}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        verification_status: {$ref: "#/components/schemas/VerificationStatus"}
      allOf:
        - if:
            properties:
              field:
                enum:
                  - contract_party_owner
                  - contract_party_agency
                  - payment_method
                  - refund_condition
                  - advertising_channel
                  - content_type
                  - posting_frequency
                  - reporting_frequency
                  - performance_guarantee
                  - content_ownership
                  - portrait_rights
                  - facility_damage_liability
                  - false_advertising_liability
          then:
            properties:
              value_type: {const: TEXT}
        - if:
            properties:
              field: {enum: [contract_start_date, contract_end_date, termination_notice_date]}
          then:
            properties:
              value_type: {const: DATE}
        - if:
            properties:
              field: {enum: [monthly_amount, contract_total_amount]}
          then:
            properties:
              value_type: {const: MONEY_KRW}
        - if:
            properties:
              field: {const: content_quantity}
          then:
            properties:
              value_type: {const: INTEGER}
        - if:
            properties:
              field: {const: termination_penalty_rate}
          then:
            properties:
              value_type: {const: PERCENT}
        - if:
            properties:
              field: {enum: [auto_renewal, early_termination_allowed]}
          then:
            properties:
              value_type: {const: BOOLEAN}
        - if:
            properties:
              value_type: {const: TEXT}
          then:
            properties:
              value: {type: [string, "null"]}
        - if:
            properties:
              value_type: {const: DATE}
          then:
            properties:
              value: {type: [string, "null"], format: date}
        - if:
            properties:
              value_type: {const: MONEY_KRW}
          then:
            properties:
              value: {type: [integer, "null"], format: int64, minimum: 0}
        - if:
            properties:
              value_type: {const: INTEGER}
          then:
            properties:
              value: {type: [integer, "null"], minimum: 0}
        - if:
            properties:
              value_type: {const: PERCENT}
          then:
            properties:
              value: {type: [integer, "null"], minimum: 0, maximum: 100}
        - if:
            properties:
              value_type: {const: BOOLEAN}
          then:
            properties:
              value: {type: [string, "null"], enum: ["YES", "NO", "UNKNOWN", null]}
        - if:
            properties:
              verification_status: {const: VERIFIED}
          then:
            properties:
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
              value:
                not: {type: "null"}
        - if:
            properties:
              verification_status: {const: NOT_FOUND}
          then:
            properties:
              source_page: {type: "null"}
              source_text: {type: "null"}
              value: {type: "null"}
    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, type, severity, detection_method, model_confidence, plain_explanation, source_page, source_text, verification_status, suggestion_accept, suggestion_compromise, suggestion_request, status]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MISMATCH, NO_BASIS, UNCLEAR, MISSING, NEEDS_CHECK]}
        severity: {type: string, enum: [INFO, CHECK, IMPORTANT]}
        detection_method: {type: string, enum: [DETERMINISTIC, MODEL, HYBRID]}
        model_confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        plain_explanation: {type: string}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        verification_status: {$ref: "#/components/schemas/VerificationStatus"}
        suggestion_accept: {type: string}
        suggestion_compromise: {type: string}
        suggestion_request: {type: string}
        user_choice: {type: [string, "null"], enum: [ACCEPT, COMPROMISE, REQUEST, null]}
        status: {type: string, enum: [UNREVIEWED, SELECTED, SENT, RESOLVED, KEPT_ORIGINAL]}
      allOf:
        - if:
            properties:
              detection_method: {enum: [MODEL, HYBRID]}
          then:
            properties:
              model_confidence: {type: number}
        - if:
            properties:
              detection_method: {const: DETERMINISTIC}
          then:
            properties:
              model_confidence: {type: "null"}
    Analysis:
      type: object
      additionalProperties: false
      required: [contract_id, extracted_terms, review_items]
      properties:
        contract_id: {type: string, format: uuid}
        extracted_terms:
          type: array
          items: {$ref: "#/components/schemas/ExtractedTerm"}
        review_items:
          type: array
          items: {$ref: "#/components/schemas/ReviewItem"}
    AnalysisStartRequest:
      type: object
      additionalProperties: false
      required: [document_id]
      properties:
        document_id:
          type: string
          format: uuid
          description: 같은 계약에 속하며 type이 CONTRACT인 분석 대상 문서
    AnalysisTask:
      type: object
      additionalProperties: false
      required: [id, contract_id, document_id, status, attempt_count, error_code, result, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AnalysisStatus"}
        attempt_count:
          type: integer
          minimum: 0
          maximum: 2
          description: 초기 추출을 1회차로 계산하며, 아직 시작하지 않았으면 0
        error_code:
          type: [string, "null"]
          enum: [DOCUMENT_PARSE_FAILED, ANALYSIS_SCHEMA_INVALID, null]
        result:
          oneOf:
            - {$ref: "#/components/schemas/Analysis"}
            - {type: "null"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              status: {enum: [QUEUED, PROCESSING]}
          then:
            properties:
              error_code: {type: "null"}
              result: {type: "null"}
        - if:
            properties:
              status: {const: COMPLETED}
          then:
            properties:
              error_code: {type: "null"}
              result: {$ref: "#/components/schemas/Analysis"}
        - if:
            properties:
              status: {const: FAILED}
          then:
            properties:
              error_code:
                type: string
                enum: [DOCUMENT_PARSE_FAILED, ANALYSIS_SCHEMA_INVALID]
              result: {type: "null"}
    AnalysisTaskResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AnalysisTask"}
    ReviewItemUpdate:
      type: object
      additionalProperties: false
      required: [user_choice]
      properties:
        user_choice: {type: string, enum: [ACCEPT, COMPROMISE, REQUEST]}
    ReviewItemResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ReviewItem"}
    AdjustmentRequestItem:
      type: object
      additionalProperties: false
      required: [review_item_id, user_choice, request_text]
      properties:
        review_item_id: {type: string, format: uuid}
        user_choice: {type: string, enum: [ACCEPT, COMPROMISE, REQUEST]}
        request_text:
          type: string
          minLength: 1
          description: 사용자가 외부 발송 전에 확인할 실제 요청 문구
    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [id, contract_id, status, items, expires_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AdjustmentRequestStatus"}
        items:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/AdjustmentRequestItem"}
        expires_at: {type: string, format: date-time}
        opened_at: {type: [string, "null"], format: date-time}
        responded_at: {type: [string, "null"], format: date-time}
    AdjustmentRequestCreate:
      type: object
      additionalProperties: false
      required: [review_item_ids, expires_in_hours]
      properties:
        review_item_ids:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {type: string, format: uuid}
        expires_in_hours: {type: integer, minimum: 1, maximum: 168}
    ExplicitConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          const: true
          description: 미리보기를 확인하고 외부 발송을 승인했음을 뜻한다.
    AdjustmentRequestSent:
      type: object
      additionalProperties: false
      required: [id, status, public_url, expires_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, const: SENT}
        public_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    AdjustmentRequestSentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AdjustmentRequestSent"}
    AdjustmentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AdjustmentRequest"}
    PublicAdjustment:
      type: object
      required: [contract_title, status, expires_at, items]
      properties:
        contract_title: {type: string}
        status: {$ref: "#/components/schemas/AdjustmentRequestStatus"}
        expires_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [item_id, request_text]
            properties:
              item_id:
                type: string
                description: 공개 요청 범위에서만 유효한 불투명 항목 식별자
              request_text: {type: string}
    PublicAdjustmentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicAdjustment"}
    AdjustmentResponsesSubmit:
      type: object
      additionalProperties: false
      required: [responses]
      properties:
        responses:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: 공개 요청의 모든 item_id를 빠짐없이 정확히 한 번씩 포함해야 하며 서버가 이를 검증한다.
          items:
            type: object
            additionalProperties: false
            required: [item_id, decision]
            properties:
              item_id:
                type: string
                description: 공개 요청 범위에서만 유효한 불투명 항목 식별자
              decision: {type: string, enum: [ACCEPT, REJECT, COUNTER]}
              counter_text: {type: [string, "null"]}
              reason: {type: [string, "null"]}
            allOf:
              - if:
                  properties:
                    decision: {const: REJECT}
                then:
                  required: [reason]
                  properties:
                    reason: {type: string, minLength: 1}
              - if:
                  properties:
                    decision: {const: COUNTER}
                then:
                  required: [counter_text, reason]
                  properties:
                    counter_text: {type: string, minLength: 1}
                    reason: {type: string, minLength: 1}
    AdjustmentResponseItem:
      type: object
      additionalProperties: false
      required: [review_item_id, decision, counter_text, reason]
      properties:
        review_item_id: {type: string, format: uuid}
        decision: {type: string, enum: [ACCEPT, REJECT, COUNTER]}
        counter_text: {type: [string, "null"]}
        reason: {type: [string, "null"]}
    CounterproposalComparison:
      type: object
      additionalProperties: false
      required: [review_item_id, changed_summary, remaining_checks, final_confirmation]
      properties:
        review_item_id: {type: string, format: uuid}
        changed_summary: {type: string}
        remaining_checks:
          type: array
          items: {type: string}
        final_confirmation: {type: string}
    OwnerAdjustmentDetail:
      type: object
      additionalProperties: false
      required: [request, responses, comparisons]
      properties:
        request: {$ref: "#/components/schemas/AdjustmentRequest"}
        responses:
          type: array
          items: {$ref: "#/components/schemas/AdjustmentResponseItem"}
        comparisons:
          type: array
          items: {$ref: "#/components/schemas/CounterproposalComparison"}
    OwnerAdjustmentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/OwnerAdjustmentDetail"}
    AdjustmentConfirmation:
      type: object
      additionalProperties: false
      required: [adjustment_request_id, confirmed_items, confirmed]
      properties:
        adjustment_request_id: {type: string, format: uuid}
        confirmed_items:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: 조정 요청의 모든 항목을 빠짐없이 정확히 한 번씩 포함해야 하며 서버가 응답 이력과 대조한다.
          items:
            type: object
            additionalProperties: false
            required: [review_item_id, resolution]
            properties:
              review_item_id: {type: string, format: uuid}
              resolution:
                type: string
                enum: [ACCEPT_REQUEST, ACCEPT_COUNTERPROPOSAL, KEEP_ORIGINAL]
                description: |
                  ACCEPT_REQUEST는 대행사가 수락한 요청 문구, ACCEPT_COUNTERPROPOSAL은
                  대행사가 제시한 역제안 문구만 선택할 수 있다. 최종 문구는 서버가
                  저장된 응답에서 결정하며 클라이언트가 임의로 작성하지 않는다.
        confirmed: {type: boolean, const: true}
    PublicSubmission:
      type: object
      additionalProperties: false
      required: [submitted]
      properties:
        submitted: {type: boolean, const: true}
    PublicSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicSubmission"}
    Signature:
      type: object
      additionalProperties: false
      required: [contract_id, status, modusign_status]
      properties:
        contract_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/InternalSignatureStatus"}
        modusign_status:
          oneOf:
            - {$ref: "#/components/schemas/ModusignDocumentStatus"}
            - {type: "null"}
        modusign_document_id: {type: [string, "null"]}
        requested_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    SignatureMethod:
      oneOf:
        - $ref: "#/components/schemas/EmailSignatureMethod"
        - $ref: "#/components/schemas/KakaoSignatureMethod"
      discriminator:
        propertyName: type
        mapping:
          EMAIL: "#/components/schemas/EmailSignatureMethod"
          KAKAO: "#/components/schemas/KakaoSignatureMethod"
    EmailSignatureMethod:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: {type: string, const: EMAIL}
        value:
          type: string
          format: email
          description: 응답과 로그에 다시 노출하지 않는 이메일 주소
    KakaoSignatureMethod:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: {type: string, const: KAKAO}
        value:
          type: string
          pattern: "^01[016789][0-9]{7,8}$"
          description: 하이픈을 제외한 국내 휴대전화 번호이며 응답과 로그에 다시 노출하지 않는다.
    Signer:
      type: object
      additionalProperties: false
      required: [role, name, signing_method]
      properties:
        role: {type: string, enum: [OWNER, AGENCY]}
        name: {type: string, minLength: 2, maxLength: 30}
        signing_method: {$ref: "#/components/schemas/SignatureMethod"}
    SignatureRequestCreate:
      type: object
      additionalProperties: false
      required: [agreement_id, agreement_version, signers, confirmed]
      properties:
        agreement_id: {type: string, format: uuid}
        agreement_version: {type: integer, minimum: 1}
        signers:
          type: array
          minItems: 2
          maxItems: 2
          description: OWNER와 AGENCY를 각각 한 명씩 포함하며 연락처가 중복되면 안 된다.
          items: {$ref: "#/components/schemas/Signer"}
          allOf:
            - contains:
                type: object
                required: [role]
                properties:
                  role: {const: OWNER}
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                required: [role]
                properties:
                  role: {const: AGENCY}
              minContains: 1
              maxContains: 1
        confirmed:
          type: boolean
          const: true
          description: 사용자가 서명자와 합의서 미리보기를 최종 확인함
    SignatureResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Signature"}
    Agreement:
      type: object
      additionalProperties: false
      required: [id, version, contract_id, title, clauses]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        contract_id: {type: string, format: uuid}
        title: {type: string, const: 광고대행 계약조건 변경·확인 합의서}
        clauses:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [review_item_id, outcome, before, after]
            properties:
              review_item_id: {type: string, format: uuid}
              outcome: {type: string, enum: [AGREED, KEPT_ORIGINAL]}
              before: {type: string}
              after: {type: string}
              reason: {type: [string, "null"]}
    AgreementResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Agreement"}
    ModusignWebhookEvent:
      type: object
      additionalProperties: false
      required: [event, document]
      properties:
        event:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              description: 이 endpoint는 아래 P0 이벤트만 구독한다.
              enum:
                - document_started
                - document_signed
                - document_all_signed
                - document_rejected
                - document_request_canceled
                - document_signing_canceled
        document:
          type: object
          additionalProperties: true
          required: [id]
          properties:
            id: {type: string, minLength: 1}
            requester:
              type: object
              additionalProperties: true
              properties:
                email:
                  type: string
                  format: email
                  description: 모두싸인이 전달한 요청자 메타데이터이며 인증에 사용하거나 로그에 남기지 않는다.
    Obligation:
      type: object
      required: [id, contract_id, title, due_date, assignee, evidence_type, status, payment_condition_met]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        title: {type: string}
        due_date: {type: string, format: date}
        assignee: {type: string, enum: [AGENCY, OWNER]}
        evidence_type: {type: string, enum: [URL]}
        evidence_url:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        status: {$ref: "#/components/schemas/ObligationStatus"}
        submitted_at: {type: [string, "null"], format: date-time}
        reviewed_at: {type: [string, "null"], format: date-time}
        payment_condition_met:
          type: boolean
          description: APPROVED일 때만 true이며 실제 지급 승인이 아님
    ObligationCreate:
      type: object
      additionalProperties: false
      required: [title, due_date]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: 사용자가 선택한 첫 번째 대표 산출물
        due_date:
          type: string
          format: date
          description: 계약서에 근거가 있으면 그 날짜를 사용하고, 없으면 사용자가 확인해 입력한다.
    ObligationResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Obligation"}
    ObligationListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/Obligation"}
    PublicLink:
      type: object
      additionalProperties: false
      required: [public_url, scope, expires_at]
      properties:
        public_url:
          type: string
          format: uri
          description: 생성 응답에서만 반환하고 로그나 이후 조회 응답에 남기지 않는다.
        scope: {type: string, const: OBLIGATION_EVIDENCE}
        expires_at: {type: string, format: date-time}
    PublicLinkCreate:
      type: object
      additionalProperties: false
      required: [expires_in_hours]
      properties:
        expires_in_hours: {type: integer, minimum: 1, maximum: 168}
    PublicLinkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicLink"}
    Dashboard:
      type: object
      required: [total, signing, in_progress, completed, expiring_soon, unresolved_signals, obligation_pending, obligation_submitted, obligation_approved, total_committed]
      properties:
        total: {type: integer, minimum: 0}
        signing: {type: integer, minimum: 0}
        in_progress: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        expiring_soon: {type: integer, minimum: 0}
        unresolved_signals: {type: integer, minimum: 0}
        obligation_pending: {type: integer, minimum: 0}
        obligation_submitted: {type: integer, minimum: 0}
        obligation_approved: {type: integer, minimum: 0}
        total_committed: {type: integer, format: int64, minimum: 0}
        most_common_signal: {type: [string, "null"]}
    DashboardResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Dashboard"}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Health"}
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, error, requestId]
      properties:
        data: {}
        error: {type: "null"}
        requestId: {type: string, pattern: "^req_[a-f0-9]+$"}
