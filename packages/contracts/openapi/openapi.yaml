openapi: 3.1.0
info:
  title: 단디계약 API
  version: 0.3.0
  description: P0 활성 API와 P2 계획 API를 프런트엔드와 FastAPI가 공유하는 HTTP 계약
servers:
  - url: /api/v1
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: API 상태 확인
      operationId: healthCheck
      tags: [health]
      security: []
      responses:
        "200":
          description: API 상태 확인
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /contracts:
    get:
      summary: 계약 목록 조회
      operationId: listContracts
      tags: [contracts]
      description: 만료일이 가까운 계약부터 정렬하며, 만료일이 없으면 마지막에 둔다. 같은 만료일은 id 오름차순으로 정렬한다.
      responses:
        "200":
          description: 소유자의 계약 목록과 만료 D-day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 계약 생성
      operationId: createContract
      tags: [contracts]
      description: 계약 생성과 CONTRACT_CREATED 감사 이벤트를 하나의 트랜잭션으로 기록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCreate"
      responses:
        "201":
          description: 계약 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /contracts/{contract_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 계약 상세 조회
      operationId: getContract
      tags: [contracts]
      responses:
        "200":
          description: 계약 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{contract_id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 계약 감사 타임라인 조회
      operationId: getContractTimeline
      tags: [contracts]
      description: created_at 오름차순, id 오름차순으로 정렬한 append-only 감사 타임라인을 반환한다.
      responses:
        "200":
          description: 민감정보를 제외한 계약 감사 타임라인
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /contracts/{contract_id}/renewal-decision:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    put:
      summary: 만료·재계약 의사 저장
      operationId: saveRenewalDecision
      tags: [contracts]
      description: |
        만료·재계약 검토 화면에서 사용자가 명시적으로 선택한 의사와 시각만 기록한다.
        D-30 만료, D-14 해지 통보기한, D-7 자동갱신 중 하나의 검토 구간일 때 허용한다.
        같은 선택의 반복 PUT은 기존 decided_at과 응답을 유지하고 새 AuditEvent를 만들지
        않으며, 다른 선택으로 바꿀 때만 시각과 RENEWAL_DECISION_SAVED AuditEvent를
        같은 트랜잭션에서 갱신한다.
        이 호출은 계약 종료, 새 계약·조정·서명 요청, 재계약 문서 생성을 자동 실행하지
        않는다. 재계약 초안 복제는 P1이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewalDecisionRequest"
      responses:
        "200":
          description: 재계약 의사와 감사 이벤트 기록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenewalDecisionResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/documents:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 계약 문서 업로드
      operationId: uploadContractDocument
      tags: [documents]
      description: |
        CONTRACT, PROPOSAL, ESTIMATE는 PDF를 받고 MESSAGE는 PDF, PNG, JPEG 또는 UTF-8
        text 파일을 선택 자료로 받을 수 있다. 확장자만 믿지 않고 선언 MIME과 magic
        bytes를 함께 검증한다. 빈 파일, 손상·암호화 PDF를 거부하며 P0 기본 제한은
        파일당 20 MiB, PDF 100페이지다. 페이지가 없는 이미지·text MESSAGE는
        source_page=1인 단일 가상 페이지로 정규화한다. 문서 메타데이터 저장과
        DOCUMENT_UPLOADED 감사 이벤트는 하나의 트랜잭션으로 기록한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: "#/components/schemas/ContractDocumentUploadType"
      responses:
        "201":
          description: 문서 업로드 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/documents/{document_id}/access:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      summary: 계약 원문 임시 접근 URL 발급
      operationId: getDocumentAccess
      tags: [documents]
      description: |
        객체 소유권을 확인한 뒤 private Storage 원문을 최대 5분 동안 읽을 수 있는 URL을
        반환한다. source_page가 있으면 클라이언트가 해당 문서 또는 가상 페이지를 바로 표시한다.
        source_page가 문서의 page_count를 벗어나면 422로 거부한다. 영속 file_url이나
        Storage 경로는 공개하지 않는다.
      parameters:
        - name: source_page
          in: query
          required: false
          description: 1-based 원문 페이지이며 해당 문서의 page_count 이하여야 한다.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: 소유자용 짧은 원문 접근 URL
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAccessResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/understood-terms:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    put:
      summary: 사용자가 이해한 계약 조건 저장
      operationId: saveUnderstoodTerms
      tags: [contracts]
      description: |
        한 계약의 다섯 조건을 전체 교체 방식으로 저장한다. 실제 값이 바뀌면 저장과
        UNDERSTOOD_TERMS_SAVED 감사 이벤트를 하나의 트랜잭션으로 기록하고, 동일한
        PUT 재시도는 저장값을 반환하되 감사 이벤트를 중복 생성하지 않는다.
        source_type은 USER_MEMORY만 허용하며 contract_id는 경로와 인증 컨텍스트에서 정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnderstoodTermInput"
      responses:
        "200":
          description: 사용자가 이해한 다섯 조건 저장
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnderstoodTermResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/analysis:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 계약 분석 시작
      operationId: startAnalysis
      tags: [analysis]
      description: |
        분석 완료 시 VERIFIED이고 필드·값 타입·원문 근거 검증을 통과한 단일 후보만
        결정적 코드로 Contract의 비어 있는 canonical 날짜·금액·갱신 필드에 반영한다.
        canonical 승격과 대표 의무 자동 생성에는 CONTRACT_DOCUMENT 근거만 사용한다.
        supporting_document_ids의 결과는 DOCUMENTED_EXPLANATION으로 분리해 비교·표시한다.
        기존 값과 충돌하거나 NOT_FOUND, MISSING_EVIDENCE, NEEDS_CHECK인 후보는 반영하지
        않고 ReviewItem으로 남긴다. 첫 번째 명확하고 VERIFIED인 산출물과 기한이 있으면
        계약당 대표 Obligation 한 건을 멱등하게 자동 생성한다. canonical 승격,
        대표 의무 생성, 분석 완료와 ANALYSIS_COMPLETED 감사 이벤트는 하나의 로컬
        트랜잭션으로 기록한다. 최초 접수에서는 계약 상태, QUEUED 작업과
        ANALYSIS_STARTED 감사 이벤트를 같은 트랜잭션에 기록한다.
        이전 최신 작업이 FAILED이고 실행 중 작업이 없으면 사용자가 새 Idempotency-Key로
        수동 재시작할 수 있다. 계약은 ANALYZING을 유지하며 새 QUEUED 작업과
        ANALYSIS_RESTARTED 감사 이벤트를 만든다. 기존 키 재호출은 최초 HTTP 결과(보통
        202 접수, 접수 자체 실패 시 503)를 재생하고 새 작업을 만들지 않는다. 비동기
        FAILED 상태는 조회 API에서 확인한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStartRequest"
      responses:
        "202":
          description: 분석 작업 접수
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisTaskResponse"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "503":
          $ref: "#/components/responses/ExternalServiceUnavailable"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
    get:
      summary: 계약 분석 상태와 결과 조회
      operationId: getAnalysis
      tags: [analysis]
      responses:
        "200":
          description: 처리 중·완료·실패를 포함한 분석 작업 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisTaskResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/review-items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: 검토 항목 선택 수정
      operationId: updateReviewItem
      tags: [review]
      description: UNREVIEWED 또는 SELECTED 상태에서만 선택을 저장하고 REVIEW_ITEM_SELECTION_UPDATED 감사 이벤트를 같은 트랜잭션에 기록한다. 조정 요청이 발송되어 SENT 이상이 되면 발송 스냅샷과 다르게 바꾸지 못하도록 거부한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewItemUpdate"
      responses:
        "200":
          description: 사용자 선택 반영
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/adjustment-requests:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 조정 요청 초안 생성
      operationId: createAdjustmentRequest
      tags: [adjustments]
      description: 링크나 토큰 없이 초안을 만들고 ADJUSTMENT_DRAFT_CREATED 감사 이벤트를 같은 트랜잭션에 기록한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequestCreate"
      responses:
        "201":
          description: 사용자가 확인할 조정 요청 초안 생성
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
  /contracts/{contract_id}/adjustment-requests/{adjustment_request_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/AdjustmentRequestId"
    get:
      summary: 소유자용 조정 요청 상세 조회
      operationId: getOwnerAdjustmentRequest
      tags: [adjustments]
      responses:
        "200":
          description: 대행사 응답과 역제안 비교를 포함한 소유자용 조정 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAdjustmentDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "502": {$ref: "#/components/responses/CounterproposalComparisonFailed"}
  /contracts/{contract_id}/adjustment-requests/{adjustment_request_id}/send:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/AdjustmentRequestId"
    post:
      summary: 조정 요청 공개 링크 활성화
      operationId: sendAdjustmentRequest
      tags: [adjustments]
      description: |
        사용자 미리보기 확인 후 공개 링크를 활성화하고 DRAFT에서 SENT로 전환한다.
        P0에서는 계약당 실제 발송·응답 라운드를 한 번만 허용하며 다른 발송 이력이 있으면
        INVALID_STATUS_TRANSITION으로 거부한다. 포함된 ReviewItem을 SENT로 고정하고
        ADJUSTMENT_SENT 감사 이벤트를 같은 트랜잭션에 기록한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplicitConfirmation"
      responses:
        "200":
          description: 공개 링크 활성화 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestSentResponse"
        "409":
          $ref: "#/components/responses/NoStoreInvalidTransition"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
  /public/adjustment-requests/{token}:
    parameters:
      - $ref: "#/components/parameters/AdjustmentToken"
    get:
      summary: 공개 조정 요청 조회
      operationId: getPublicAdjustmentRequest
      tags: [public]
      description: |
        조회 자체는 상태를 변경하지 않는다. 실제 화면 열람 후 별도 open endpoint가
        SENT를 OPENED로 전환한다. 형식·길이·scope·대상이 올바르지 않은 토큰은 리소스
        존재를 숨기기 위해 모두 404로 처리하고, 유효하지만 만료된 토큰만 410으로 처리한다.
      security: []
      responses:
        "200":
          description: 대행사 공개 조정 요청
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdjustmentResponse"
        "410":
          $ref: "#/components/responses/PublicExpiredLink"
        "404": {$ref: "#/components/responses/PublicNotFound"}
  /public/adjustment-requests/{token}/open:
    parameters:
      - $ref: "#/components/parameters/AdjustmentToken"
    post:
      summary: 공개 조정 요청 열람 확인
      operationId: openPublicAdjustmentRequest
      tags: [public]
      description: |
        실제 공개 화면이 렌더링된 뒤 호출하며, 최초 호출만 SENT에서 OPENED로 전환하고
        ADJUSTMENT_OPENED 감사 이벤트를 같은 트랜잭션에 기록한다. 반복 호출은 같은
        결과를 반환한다. 형식·길이·scope·대상이 올바르지 않은 토큰은 모두 404로
        처리하고, 유효하지만 만료된 토큰만 410으로 처리한다.
      security: []
      responses:
        "200":
          description: 열람 상태 기록 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdjustmentOpenResponse"
        "404": {$ref: "#/components/responses/PublicNotFound"}
        "410": {$ref: "#/components/responses/PublicExpiredLink"}
  /public/adjustment-requests/{token}/responses:
    parameters:
      - $ref: "#/components/parameters/AdjustmentToken"
    post:
      summary: 대행사 조정 응답 제출
      operationId: submitAdjustmentResponses
      tags: [public]
      description: SENT에서 직접 제출되면 응답 시각을 최초 opened_at으로도 기록한 뒤 RESPONDED로 전환하고 ADJUSTMENT_RESPONDED 감사 이벤트를 같은 트랜잭션에 기록한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentResponsesSubmit"
      responses:
        "201":
          description: 전체 응답 제출 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubmissionResponse"
        "409":
          $ref: "#/components/responses/PublicInvalidTransition"
        "404": {$ref: "#/components/responses/PublicNotFound"}
        "410": {$ref: "#/components/responses/PublicExpiredLink"}
        "422": {$ref: "#/components/responses/PublicValidationError"}
  /contracts/{contract_id}/adjustment-confirmation:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 최종 조정 결과 확정
      operationId: confirmAdjustment
      tags: [adjustments]
      description: |
        저장된 요청·응답에서 최종 문구를 결정한다. ACCEPT_REQUEST와
        ACCEPT_COUNTERPROPOSAL 항목은 관련 ReviewItem을 SENT에서 RESOLVED로,
        KEEP_ORIGINAL 항목은 SENT에서 KEPT_ORIGINAL로 바꾼다. 조정 상태와 최종 문구,
        ADJUSTMENT_CONFIRMED 감사 이벤트를 하나의 트랜잭션으로 기록한다. 계약은
        NEGOTIATING을 유지하며 수정 계약서 대조 확인 후에만 READY_TO_SIGN이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentConfirmation"
      responses:
        "200":
          description: 사용자가 응답을 검토하고 최종 합의 조건 확정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentRequestResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
