  /contracts/{contract_id}/obligations/{obligation_id}/evidence-link:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/ObligationId"
    post:
      summary: 산출물 증빙 제출 링크 생성
      operationId: createObligationEvidenceLink
      tags: [obligations]
      description: |
        산출물 제출에만 사용할 수 있는 별도 scope의 만료형 공개 링크를 생성한다.
        expires_at은 최초 성공 시각에 expires_in_hours를 더해 계산하며 같은 멱등 요청은
        최초 URL과 expires_at을 그대로 재생한다. 최초 생성 시 EVIDENCE_LINK_CREATED
        감사 이벤트를 같은 트랜잭션에 기록한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLinkCreate"
      responses:
        "201":
          description: 증빙 제출 링크 생성
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicLinkResponse"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "409": {$ref: "#/components/responses/NoStoreInvalidTransition"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
  /public/obligations/{token}/evidence:
    parameters:
      - $ref: "#/components/parameters/ObligationToken"
    post:
      summary: 산출물 증빙 제출
      operationId: submitObligationEvidence
      tags: [public, obligations]
      description: |
        최초 유효 제출만 PENDING에서 SUBMITTED로 전환하고 EVIDENCE_SUBMITTED 감사
        이벤트를 같은 트랜잭션에 기록한다. 형식·길이·scope·대상이 올바르지 않은
        토큰은 모두 404, 유효하지만 만료된 토큰은 410으로 처리한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
