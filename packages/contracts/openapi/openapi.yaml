      operationId: createAgreement
      tags: [agreements]
      description: |
        이전 데이터 호환만을 위한 deprecated API이며 새 P0 흐름에서는 호출하지 않는다.
        원계약 문서 ID와 검증된 canonical signed_date가 없으면 INVALID_STATUS_TRANSITION으로
        거부한다. 원본 계약서는 수정하지 않으며, 확정된 조항으로 새 변경·확인 합의서 PDF를
        private Storage에 한 번 렌더링한다. PDF의 위치·SHA-256·페이지 수·합의서 레코드와
        AGREEMENT_CREATED 감사 이벤트는 하나의 DB 트랜잭션으로 기록한다. PDF 저장 또는
        메타데이터 기록에 실패하면 생성 전체를 실패 처리하고 저장된 파일을 정리한다. 응답에는
        private Storage 경로나 해시를 노출하지 않는다.
      parameters:
