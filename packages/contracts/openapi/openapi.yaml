      responses:
        "200":
          description: 증빙 제출 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubmissionResponse"
        "404": {$ref: "#/components/responses/PublicNotFound"}
        "409": {$ref: "#/components/responses/PublicInvalidTransition"}
        "410": {$ref: "#/components/responses/PublicExpiredLink"}
        "422": {$ref: "#/components/responses/PublicValidationError"}
  /contracts/{contract_id}/obligations/{obligation_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/ObligationId"
    patch:
      summary: 산출물 증빙 검토
      operationId: reviewObligation
      tags: [obligations]
      description: 승인 시 EVIDENCE_APPROVED, 이의 제기 시 EVIDENCE_DISPUTED 감사 이벤트를 상태와 같은 트랜잭션에 기록한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, DISPUTED]
      responses:
        "200":
          description: 사용자 확인 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObligationResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidTransition"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /contracts/{contract_id}/performance-reports:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 월별 광고효과 리포트 업로드
      operationId: createPerformanceReport
      tags: [performance]
      description: |
        소유자가 SIGNED, IN_PROGRESS, RENEWAL_DUE 또는 COMPLETED 계약에 PDF, PNG,
        JPEG 월별 리포트를 올린다. 원본은 private Storage와
        Document.type=PERFORMANCE_REPORT로 보존하며 source_document_id만 응답한다.
        계약·period별 논리 리포트는 한 건뿐이다. 멱등 fingerprint는 정규화한 period,
        파일 SHA-256, 검증한 MIME, 파일 크기로 계산한다. 같은 키와 같은 요청은 최초
        응답을 재생하고 다른 요청이면 IDEMPOTENCY_CONFLICT, 다른 키로 같은 월을
        생성하면 REPORT_PERIOD_ALREADY_EXISTS를 반환한다. 성공·오류 응답은 모두
        Cache-Control: no-store이며 이 API는 계약 상태를 변경하지 않는다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [period, file]
              properties:
                period:
                  $ref: "#/components/schemas/PerformancePeriod"
                file:
                  type: string
                  format: binary
                  description: MIME와 magic bytes가 일치하는 비어 있지 않은 PDF, PNG 또는 JPEG
      responses:
        "201":
          description: UPLOADED 리포트와 PERFORMANCE_REPORT 원본 문서 연결 생성
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReportCreatedResponse"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "409": {$ref: "#/components/responses/PerformanceReportUploadConflict"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
        "503": {$ref: "#/components/responses/NoStoreExternalServiceUnavailable"}
  /contracts/{contract_id}/performance-reports/{report_id}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/PerformanceReportId"
    patch:
      summary: 광고효과 추출값 최초 확정 또는 정정
      operationId: confirmPerformanceReport
      x-implementation-status: planned
      tags: [performance]
      description: |
        EXTRACTED 리포트는 expected_revision=0으로 version 1을 확정한다. 이미 확정된
        리포트는 현재 version과 같은 expected_revision 및 1~500자 correction_reason으로
        가장 최근 확정 월에만 append-only revision을 추가한다. impressions, likes,
        comments는 필수이고 engagement_rate는 요청으로 받지 않는다. 서버는 원본 정수에서
        (likes + comments + saves + shares) / impressions를 Decimal로 계산하며
        impressions=0이면 null, 응답은 소수 6자리 ROUND_HALF_UP 값이다. 확정과 함께
        결정 규칙의 flag, 검증된 계약 근거 snapshot, performance-inquiry-copy-v1 문의
        문안 snapshot을 원자 저장한다. 응답·오류 모두 Cache-Control: no-store이며
        문의 문안을 자동 발송하지 않는다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerformanceReportConfirmation"
      responses:
        "200":
          description: 최초 확정 또는 append-only 정정 revision 생성
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReportConfirmedResponse"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "409": {$ref: "#/components/responses/PerformanceReportConfirmConflict"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
  /contracts/{contract_id}/performance-reports/{report_id}/extract:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - $ref: "#/components/parameters/PerformanceReportId"
    post:
      summary: 광고효과 리포트 지표 추출
      operationId: extractPerformanceReport
      tags: [performance]
      description: |
        UPLOADED 리포트 원본을 Upstage Document Parse로 읽고 Solar strict schema로
        지표 후보와 원문 근거를 매핑한다. 찾지 못한 값은 추정하지 않고 NOT_FOUND로
        반환하며 이 단계의 값은 비교·문의 문안에 사용하지 않는다. report와 Document를
        잠깐 잠가 extraction attempt를 claim한 뒤 외부 호출은 트랜잭션 밖에서 수행한다.
        15분 미만의 활성 attempt는 REPORT_EXTRACTION_IN_PROGRESS로 거부하고, 15분 이상
        지난 attempt만 새 Idempotency-Key의 명시적 재시도로 원자 재점유한다. 현재
        attempt와 일치하는 완료만 저장한다. 실패하면 report는 UPLOADED를 유지하고
        REPORT_EXTRACT_FAILED를 반환한다. 자동 재시도는 없으며 성공·오류 응답 모두
        Cache-Control: no-store다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 근거가 연결된 지표 후보 추출 완료
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReportExtractedResponse"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "409": {$ref: "#/components/responses/PerformanceReportExtractConflict"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
        "502": {$ref: "#/components/responses/NoStoreReportExtractFailed"}
        "503": {$ref: "#/components/responses/NoStoreExternalServiceUnavailable"}
  /contracts/{contract_id}/performance:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 계약별 월별 광고효과 조회
      operationId: getContractPerformance
      x-implementation-status: planned
      tags: [performance]
      description: |
        report 원본 연결과 version 오름차순 revision 이력, 각 월의 최신 확정 revision만
        모은 confirmed_series, 최신 revision의 flags와 저장된 inquiry_drafts를 반환한다.
        ENGAGEMENT_RATE_DROP은 달력상 바로 전월, 두 달 모두 impressions 1,000 이상,
        같은 saves·shares 포함 구성, 이전 반응률 > 0, 반올림 전 절대 하락 1.0%p 이상과
        상대 하락 25% 이상을 모두 만족할 때만 생성한다. DELIVERABLE_COUNT_SHORTFALL은
        검증된 월 수량 계약 근거가 있고 actual_count < expected_count일 때만 생성한다.
        UPLOADED·EXTRACTED와 과거 revision은 confirmed_series에 포함하지 않는다. 조회는
        AI·문안 생성·상태 변경·감사 이벤트를 실행하지 않으며 성공·오류 응답 모두
        Cache-Control: no-store다.
      responses:
        "200":
          description: 최신 확정값 집계와 append-only 이력
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractPerformanceResponse"
        "401": {$ref: "#/components/responses/NoStoreUnauthorized"}
        "404": {$ref: "#/components/responses/NoStoreNotFound"}
        "422": {$ref: "#/components/responses/NoStoreValidationError"}
  /dashboard:
    get:
      summary: 대시보드 조회
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: 소상공인 대시보드 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
  /webhooks/modusign:
    post:
      summary: 모두싸인 웹훅 수신
      operationId: receiveModusignWebhook
      tags: [webhooks]
      description: |
        모두싸인 웹훅 등록의 custom headers에 설정한 X-Modusign-Webhook-Secret을 검증한다.
        인증 성공 후 이벤트를 멱등하게 저장하고 즉시 204를 반환한다. 문서 상태 조회와
        계약 상태 전이는 응답 이후 비동기로 수행한다. 실제 수신 payload에서 안정적인
        이벤트 ID를 검증할 수 있으면 사용하고, 없으면 event.type, document.id,
        canonical payload hash를 중복 판단 fingerprint로 사용한다. 임베디드 초안에 넣은
        내부 Signature ID와 HMAC 증명 metadata를 최신 문서 조회 결과에서 검증한 경우에만
        외부 문서와 연결한다. 최신 원본 상태가
        COMPLETED이면 Contract를 SIGNING에서 SIGNED로, ABORTED 또는 PROCESSING_FAILED면
        READY_TO_SIGN으로 전환하고 대응 감사 이벤트를 원자적으로 기록한다. COMPLETED가
        ON_GOING보다 먼저 관측되면 EDITING/READY_TO_SIGN에서 COMPLETED/SIGNED로 원자적으로
        보정한다. 종료 상태의
        오래된 이벤트는 상태를 되돌리지 않으며 실패 후 서명을 자동 재요청하지 않는다.
      security:
        - ModusignWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModusignWebhookEvent"
      responses:
        "204":
          description: 처리 완료 또는 이미 처리한 이벤트
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  headers:
    NoStore:
      description: 공개 토큰 또는 민감한 계약·성과 자료 응답의 캐시 방지
      schema:
        type: string
        const: no-store
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 소유자 API용 인증 토큰. 인증 공급자와 발급 방식은 구현 환경에서 결정한다.
    ModusignWebhookSecret:
      type: apiKey
      in: header
      name: X-Modusign-Webhook-Secret
      description: 모두싸인 웹훅 등록 시 서버가 설정한 고정 비밀 헤더
  parameters:
    ContractId:
      name: contract_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PerformanceReportId:
      name: report_id
      in: path
      required: true
      description: 경로의 계약에 속하는 월별 광고효과 리포트 ID
      schema: {type: string, format: uuid}
    AdjustmentRequestId:
      name: adjustment_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ObligationId:
      name: obligation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdjustmentToken:
      name: token
      in: path
      required: true
      description: ADJUSTMENT_RESPONSE scope만 가진 만료형 토큰. 원문을 로그에 남기지 않으며 형식·길이·scope·대상 불일치는 모두 404로 은닉한다.
      schema: {type: string, minLength: 32}
    ObligationToken:
      name: token
      in: path
      required: true
      description: OBLIGATION_EVIDENCE scope만 가진 만료형 토큰. 조정 API에 사용할 수 없으며 형식·길이·scope·대상 불일치는 모두 404로 은닉한다.
      schema: {type: string, minLength: 32}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        소유자·operation·resource 범위에서 중복 실행을 방지하는 UUID다. 같은 키와 같은
        요청은 최초 상태 코드와 응답을 재생하고, 같은 키에 다른 요청 본문을 보내면
        IDEMPOTENCY_CONFLICT를 반환한다.
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: Bearer 또는 웹훅 인증 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InvalidTransition:
      description: 허용되지 않은 상태 전환, 중복 제출 또는 멱등 키 충돌
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreUnauthorized:
      description: 인증 실패
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreValidationError:
      description: 캐시하면 안 되는 요청의 입력 검증 실패
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreNotFound:
      description: 캐시하면 안 되는 요청의 리소스를 찾을 수 없음
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreInvalidTransition:
      description: 캐시하면 안 되는 요청의 허용되지 않은 상태 또는 멱등 충돌
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PerformanceReportUploadConflict:
      description: |
        같은 계약·period 리포트가 이미 존재하는 REPORT_PERIOD_ALREADY_EXISTS,
        Idempotency-Key 요청 fingerprint가 다른 IDEMPOTENCY_CONFLICT 또는 허용되지 않은
        계약 상태의 INVALID_STATUS_TRANSITION
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PerformanceReportExtractConflict:
      description: |
        활성 추출 작업이 있는 REPORT_EXTRACTION_IN_PROGRESS, UPLOADED가 아닌 상태의
        INVALID_STATUS_TRANSITION 또는 IDEMPOTENCY_CONFLICT
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PerformanceReportConfirmConflict:
      description: |
        REPORT_REVISION_CONFLICT, REPORT_CORRECTION_DEPENDENCY_EXISTS,
        INVALID_STATUS_TRANSITION 또는 IDEMPOTENCY_CONFLICT
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreReportExtractFailed:
      description: Upstage Parse, Solar 요청 또는 strict 출력 검증 실패인 REPORT_EXTRACT_FAILED
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NoStoreExternalServiceUnavailable:
      description: private Storage 또는 성과 리포트 영속 기반 서비스를 사용할 수 없음
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ExternalServiceUnavailable:
      description: 분석 작업을 시작할 수 없음
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    CounterproposalComparisonFailed:
      description: Solar 역제안 비교 요청 또는 출력 검증 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    ModusignRequestFailed:
      description: 모두싸인 서명 요청 실패
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicNotFound:
      description: 공개 리소스·토큰 형식·길이·scope·대상 불일치를 구분하지 않는 404 NOT_FOUND
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PublicNotFoundErrorResponse"}
    PublicValidationError:
      description: 공개 요청 입력 검증 실패
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicInvalidTransition:
      description: 허용되지 않은 상태 전환 또는 중복 제출
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    PublicExpiredLink:
      description: 공개 링크 만료
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - DOCUMENT_PARSE_FAILED
            - ANALYSIS_SCHEMA_INVALID
            - ANALYSIS_START_FAILED
            - EXTERNAL_SERVICE_UNAVAILABLE
            - ADJUSTMENT_LINK_EXPIRED
            - OBLIGATION_LINK_EXPIRED
            - INVALID_STATUS_TRANSITION
            - MODUSIGN_REQUEST_FAILED
            - WEBHOOK_AUTH_FAILED
            - UNAUTHORIZED_ACCESS
            - IDEMPOTENCY_CONFLICT
            - REPORT_PERIOD_ALREADY_EXISTS
            - REPORT_REVISION_CONFLICT
            - REPORT_CORRECTION_DEPENDENCY_EXISTS
            - REPORT_EXTRACTION_IN_PROGRESS
            - REPORT_EXTRACT_FAILED
            - NOT_FOUND
            - VALIDATION_ERROR
        message: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, error, requestId]
      properties:
        data: {type: "null"}
        error: {$ref: "#/components/schemas/ApiError"}
        requestId: {type: string, pattern: "^req_[a-f0-9]+$"}
    PublicNotFoundErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            error:
              type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: {type: string, const: NOT_FOUND}
                message: {type: string}
    ContractStatus:
      type: string
      enum: [DRAFT, ANALYZING, REVIEW_REQUIRED, NEGOTIATING, READY_TO_SIGN, SIGNING, SIGNED, IN_PROGRESS, COMPLETED, RENEWAL_DUE]
    AdjustmentRequestStatus:
      type: string
      enum: [DRAFT, SENT, OPENED, RESPONDED, CONFIRMED, EXPIRED]
    InternalSignatureStatus:
      type: string
      enum: [REQUEST_READY, REQUESTING, EDITING, SIGNING, COMPLETED, ABORTED, FAILED]
    ModusignDocumentStatus:
      type: string
      description: DRAFT와 SCHEDULED도 원본 보존을 위해 허용하지만 P0 정상 흐름은 ON_PROCESSING → ON_GOING → COMPLETED / ABORTED / PROCESSING_FAILED다.
      enum: [DRAFT, SCHEDULED, ON_PROCESSING, ON_GOING, COMPLETED, ABORTED, PROCESSING_FAILED]
    ObligationStatus:
      type: string
      enum: [PENDING, SUBMITTED, APPROVED, DISPUTED]
    VerificationStatus:
      type: string
      enum: [VERIFIED, NOT_FOUND, MISSING_EVIDENCE, NEEDS_CHECK]
    AnalysisStatus:
      type: string
      enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
    ContractCreate:
      type: object
      additionalProperties: false
      required: [title, counterparty_name]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        counterparty_name: {type: string, minLength: 1, maxLength: 120}
    Contract:
      type: object
      additionalProperties: false
      required: [id, title, counterparty_name, status, signed_date, start_date, end_date, termination_notice_date, renewal_type, total_amount, understood_term, renewal_decision, modusign_document_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        counterparty_name: {type: string}
        status: {$ref: "#/components/schemas/ContractStatus"}
        signed_date:
          type: [string, "null"]
          format: date
          description: 원계약 체결일로 검증된 contract_signed_date 후보를 정규화한 canonical 값
        start_date:
          type: [string, "null"]
          format: date
          description: 검증된 VERIFIED 추출 후보를 결정적 코드로 정규화해 반영한 canonical 시작일
        end_date:
          type: [string, "null"]
          format: date
          description: 검증된 VERIFIED 추출 후보를 결정적 코드로 정규화해 반영한 canonical 종료일
        termination_notice_date:
          type: [string, "null"]
          format: date
          description: 검증된 VERIFIED 추출 후보를 결정적 코드로 정규화해 반영한 canonical 해지 통보기한
        renewal_type:
          type: [string, "null"]
          enum: [AUTO, MANUAL, NONE, null]
          description: 검증된 contract_renewal_type 추출값에서 결정한 canonical 갱신 유형
        total_amount:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 검증된 VERIFIED 추출 후보를 결정적 코드로 정규화해 반영한 canonical 총 약정액
        understood_term:
          oneOf:
            - {$ref: "#/components/schemas/UnderstoodTerm"}
            - {type: "null"}
          description: 5문항을 아직 저장하지 않았으면 null이며 저장 후 조항 카드 재조회에 사용하는 사용자 이해조건
        renewal_decision:
          oneOf:
            - {$ref: "#/components/schemas/RenewalDecision"}
            - {type: "null"}
          description: 사용자가 아직 선택하지 않았으면 null이며 PUT renewal-decision의 최신 저장 결과
        modusign_document_id: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ContractResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Contract"}
    RenewalDecisionType:
      type: string
      enum: [RENEW_SAME_TERMS, RENEW_WITH_CHANGES, TERMINATE]
    RenewalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, confirmed]
      properties:
        decision: {$ref: "#/components/schemas/RenewalDecisionType"}
        confirmed:
          type: boolean
          const: true
          description: 사용자가 재계약 검토 화면에서 의사를 직접 선택했음을 뜻한다.
    RenewalDecision:
      type: object
      additionalProperties: false
      required: [contract_id, decision, decided_at, revisit_review_item_ids]
      properties:
        contract_id: {type: string, format: uuid}
        decision: {$ref: "#/components/schemas/RenewalDecisionType"}
        decided_at: {type: string, format: date-time}
        revisit_review_item_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
          description: RENEW_WITH_CHANGES일 때 이전에 거절되거나 원안 유지된 검토 항목 식별자
      allOf:
        - if:
            properties:
              decision: {enum: [RENEW_SAME_TERMS, TERMINATE]}
          then:
            properties:
              revisit_review_item_ids: {type: array, maxItems: 0}
    RenewalDecisionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/RenewalDecision"}
    ContractListItem:
      type: object
      additionalProperties: false
      required: [id, title, counterparty_name, status, total_amount, end_date, expiry_d_day, termination_notice_d_day, auto_renewal_d_day]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        counterparty_name: {type: string}
        status: {$ref: "#/components/schemas/ContractStatus"}
        total_amount: {type: [integer, "null"], format: int64, minimum: 0}
        end_date: {type: [string, "null"], format: date}
        expiry_d_day: {type: [integer, "null"]}
        termination_notice_d_day: {type: [integer, "null"]}
        auto_renewal_d_day:
          type: [integer, "null"]
          description: renewal_type=AUTO이고 end_date가 있을 때 종료일까지 남은 Asia/Seoul 기준 일수. 그 외에는 null
    ContractListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/ContractListItem"}
    AuditEventType:
      type: string
      enum:
        - CONTRACT_CREATED
        - CONTRACT_STARTED
        - CONTRACT_COMPLETED
        - CONTRACT_RENEWAL_DUE
        - DOCUMENT_UPLOADED
        - UNDERSTOOD_TERMS_SAVED
        - ANALYSIS_STARTED
        - ANALYSIS_RESTARTED
        - ANALYSIS_COMPLETED
        - ANALYSIS_FAILED
        - REVIEW_ITEM_SELECTION_UPDATED
        - ADJUSTMENT_DRAFT_CREATED
        - ADJUSTMENT_SENT
        - ADJUSTMENT_OPENED
        - ADJUSTMENT_RESPONDED
        - ADJUSTMENT_CONFIRMED
        - ADJUSTMENT_EXPIRED
        - AGREEMENT_CREATED
        - REVISED_CONTRACT_REVIEW_CREATED
        - REVISED_CONTRACT_CONFIRMED
        - SIGNATURE_DRAFT_CREATED
        - SIGNATURE_REQUESTED
        - SIGNATURE_STARTED
        - SIGNATURE_COMPLETED
        - SIGNATURE_ABORTED
        - SIGNATURE_FAILED
        - OBLIGATION_CREATED
        - EVIDENCE_LINK_CREATED
        - EVIDENCE_SUBMITTED
        - EVIDENCE_APPROVED
        - EVIDENCE_DISPUTED
        - RENEWAL_DECISION_SAVED
        - PERFORMANCE_REPORT_UPLOADED
        - PERFORMANCE_REPORT_EXTRACTED
        - PERFORMANCE_REPORT_CONFIRMED
        - PERFORMANCE_REPORT_FLAGGED
        - PERFORMANCE_REPORT_CORRECTED
        - PERFORMANCE_REPORT_EXTRACTION_RECOVERED
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, actor_type, summary, created_at]
      properties:
        id: {type: string, format: uuid}
        event_type: {$ref: "#/components/schemas/AuditEventType"}
        actor_type: {type: string, enum: [OWNER, AGENCY, SYSTEM]}
        summary: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    TimelineResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: {$ref: "#/components/schemas/AuditEvent"}
    ContractDocumentUploadType:
      type: string
      enum: [CONTRACT, REVISED_CONTRACT, PROPOSAL, ESTIMATE, MESSAGE]
      description: 일반 계약 문서 업로드에서 허용하는 유형. PERFORMANCE_REPORT는 전용 API만 사용한다.
    DocumentType:
      type: string
      enum: [CONTRACT, REVISED_CONTRACT, PROPOSAL, ESTIMATE, MESSAGE, PERFORMANCE_REPORT]
    Document:
      type: object
      additionalProperties: false
      required: [id, contract_id, type, parse_status, created_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/DocumentType"}
        parse_status: {type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED]}
        created_at: {type: string, format: date-time}
    DocumentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Document"}
    DocumentAccess:
      type: object
      additionalProperties: false
      required: [document_id, access_url, expires_at, source_page]
      properties:
        document_id: {type: string, format: uuid}
        access_url:
          type: string
          format: uri
          description: 최대 5분 유효한 소유자 전용 private Storage 접근 URL
        expires_at: {type: string, format: date-time}
        source_page:
          type: [integer, "null"]
          minimum: 1
          description: 요청한 1-based 페이지. Query를 생략하면 null.
    DocumentAccessResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/DocumentAccess"}
    UnderstoodTermInput:
      type: object
      additionalProperties: false
      required: [duration_text, monthly_amount, total_amount, refund_text, termination_text, source_type]
      properties:
        duration_text:
          type: string
          minLength: 1
          description: 사용자가 이해한 계약기간
        monthly_amount:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 사용자가 이해한 월 납부액. 기억하지 못하면 null.
        total_amount:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 사용자가 이해한 총 계약금액. 기억하지 못하면 null.
        refund_text:
          type: string
          minLength: 1
          description: 사용자가 이해한 환불조건
        termination_text:
          type: string
          minLength: 1
          description: 사용자가 이해한 중도해지 가능 여부
        source_type:
          type: string
          const: USER_MEMORY
          description: 이 endpoint의 5문항은 객관적 문서 근거가 아니라 사용자가 기억하고 이해한 설명이다.
    UnderstoodTerm:
      type: object
      additionalProperties: false
      required: [contract_id, duration_text, monthly_amount, total_amount, refund_text, termination_text, source_type]
      properties:
        contract_id: {type: string, format: uuid}
        duration_text: {type: string, minLength: 1}
        monthly_amount: {type: [integer, "null"], format: int64, minimum: 0}
        total_amount: {type: [integer, "null"], format: int64, minimum: 0}
        refund_text: {type: string, minLength: 1}
        termination_text: {type: string, minLength: 1}
        source_type: {type: string, const: USER_MEMORY}
    UnderstoodTermResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/UnderstoodTerm"}
    ExtractedField:
      type: string
      enum:
        - contract_party_owner
        - contract_party_agency
        - contract_signed_date
        - contract_start_date
        - contract_end_date
        - monthly_amount
        - contract_total_amount
        - payment_method
        - auto_renewal
        - contract_renewal_type
        - termination_notice_date
        - early_termination_allowed
        - termination_penalty_rate
        - refund_condition
        - advertising_channel
        - content_type
        - content_quantity
        - deliverable_due_date
        - posting_frequency
        - reporting_frequency
        - performance_guarantee
        - advertising_account_ownership
        - content_ownership
        - shooting_safety
        - portrait_rights
        - personal_information_handling
        - facility_damage_liability
        - false_advertising_liability
    ExtractedValueType:
      type: string
      enum: [TEXT, DATE, MONEY_KRW, INTEGER, PERCENT, BOOLEAN]
    ExtractedTerm:
      type: object
      additionalProperties: false
      required: [id, contract_id, document_id, source_type, field, value_type, value, source_page, source_text, confidence, verification_status]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        source_type:
          type: string
          enum: [CONTRACT_DOCUMENT, DOCUMENTED_EXPLANATION]
          description: CONTRACT 문서는 CONTRACT_DOCUMENT, 제안서·견적서·메시지는 DOCUMENTED_EXPLANATION
        field: {$ref: "#/components/schemas/ExtractedField"}
        value_type: {$ref: "#/components/schemas/ExtractedValueType"}
        value:
          description: value_type에 따라 문자열, ISO date, 원화 정수, 정수, 0~100 비율 또는 YES/NO/UNKNOWN
          anyOf:
            - {type: string}
            - {type: integer, format: int64}
            - {type: "null"}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 해당 추출값에 대한 0~1 범위의 모델 확신도
        verification_status: {$ref: "#/components/schemas/VerificationStatus"}
      allOf:
        - if:
            properties:
              field:
                enum:
                  - contract_party_owner
                  - contract_party_agency
                  - payment_method
                  - contract_renewal_type
                  - refund_condition
                  - advertising_channel
                  - content_type
                  - posting_frequency
                  - reporting_frequency
                  - performance_guarantee
                  - advertising_account_ownership
                  - content_ownership
                  - shooting_safety
                  - portrait_rights
                  - personal_information_handling
                  - facility_damage_liability
                  - false_advertising_liability
          then:
            properties:
              value_type: {const: TEXT}
        - if:
            properties:
              field: {enum: [contract_signed_date, contract_start_date, contract_end_date, termination_notice_date, deliverable_due_date]}
          then:
            properties:
              value_type: {const: DATE}
        - if:
            properties:
              field: {enum: [monthly_amount, contract_total_amount]}
          then:
            properties:
              value_type: {const: MONEY_KRW}
        - if:
            properties:
              field: {const: content_quantity}
          then:
            properties:
              value_type: {const: INTEGER}
        - if:
            properties:
              field: {const: termination_penalty_rate}
          then:
            properties:
              value_type: {const: PERCENT}
        - if:
            properties:
              field: {enum: [auto_renewal, early_termination_allowed]}
          then:
            properties:
              value_type: {const: BOOLEAN}
        - if:
            properties:
              value_type: {const: TEXT}
          then:
            properties:
              value: {type: [string, "null"], minLength: 1}
        - if:
            properties:
              field: {const: contract_renewal_type}
          then:
            properties:
              value:
                type: [string, "null"]
                enum: [AUTO, MANUAL, NONE, UNKNOWN, null]
        - if:
            properties:
              value_type: {const: DATE}
          then:
            properties:
              value: {type: [string, "null"], format: date}
        - if:
            properties:
              value_type: {const: MONEY_KRW}
          then:
            properties:
              value: {type: [integer, "null"], format: int64, minimum: 0}
        - if:
            properties:
              value_type: {const: INTEGER}
          then:
            properties:
              value: {type: [integer, "null"], minimum: 0}
        - if:
            properties:
              value_type: {const: PERCENT}
          then:
            properties:
              value: {type: [integer, "null"], minimum: 0, maximum: 100}
        - if:
            properties:
              value_type: {const: BOOLEAN}
          then:
            properties:
              value: {type: [string, "null"], enum: ["YES", "NO", "UNKNOWN", null]}
        - if:
            properties:
              field: {enum: [auto_renewal, early_termination_allowed, contract_renewal_type]}
              value: {const: UNKNOWN}
          then:
            properties:
              verification_status: {const: NEEDS_CHECK}
        - if:
            properties:
              verification_status: {const: VERIFIED}
          then:
            properties:
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
              value:
                not: {type: "null"}
        - if:
            properties:
              verification_status: {const: NOT_FOUND}
          then:
            properties:
              source_page: {type: "null"}
              source_text: {type: "null"}
              value: {type: "null"}
        - if:
            properties:
              verification_status: {const: MISSING_EVIDENCE}
          then:
            properties:
              source_page: {type: "null"}
              source_text: {type: "null"}
              value:
                not: {type: "null"}
        - if:
            properties:
              verification_status: {const: NEEDS_CHECK}
          then:
            properties:
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
    ReviewBasisCitation:
      type: object
      additionalProperties: false
      required: [organization, document_title, url, version, effective_date]
      properties:
        organization:
          type: string
          minLength: 1
        document_title:
          type: string
          minLength: 1
        url:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
        version: {type: [string, "null"], minLength: 1}
        effective_date: {type: [string, "null"], format: date}
    ReviewItem:
      type: object
      additionalProperties: false
      required: [id, contract_id, type, severity, detection_method, model_confidence, model_limitations, plain_explanation, basis_type, basis_text, basis_citation, related_extracted_term_ids, source_document_id, source_page, source_text, source_confidence, verification_status, suggestion_accept, suggestion_compromise, suggestion_request, user_choice, status]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        type: {type: string, enum: [MISMATCH, NO_BASIS, UNCLEAR, MISSING, NEEDS_CHECK]}
        severity: {type: string, enum: [INFO, CHECK, IMPORTANT]}
        detection_method: {type: string, enum: [DETERMINISTIC, MODEL, HYBRID]}
        model_confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        model_limitations:
          type: [string, "null"]
          minLength: 1
          description: MODEL·HYBRID 판단의 한계와 사용자가 확인할 점. 결정 규칙 기반이면 null
        plain_explanation: {type: string, minLength: 1}
        basis_type: {type: string, enum: [OFFICIAL_SOURCE, INTERNAL_RULE]}
        basis_text:
          type: string
          minLength: 1
          description: 조항 카드에 원문·사용자 이해·제안 문구와 분리해 표시할 공식 기준 또는 내부 확인 규칙
        basis_citation:
          oneOf:
            - {$ref: "#/components/schemas/ReviewBasisCitation"}
            - {type: "null"}
        related_extracted_term_ids:
          type: array
          minItems: 1
          maxItems: 11
          uniqueItems: true
          items: {type: string, format: uuid}
          description: 계약 원문과 선택 자료의 비교 근거가 된 ExtractedTerm 식별자. source_*는 이 중 기본 계약 원문 근거 한 건에서 가져온다.
        source_document_id: {type: [string, "null"], format: uuid}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        source_confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: 기본 원문 근거 ExtractedTerm.confidence에서 가져온 추출 확신도. 검토 판단의 model_confidence와 구분한다.
        verification_status: {$ref: "#/components/schemas/VerificationStatus"}
        suggestion_accept: {type: string, minLength: 1}
        suggestion_compromise: {type: string, minLength: 1}
        suggestion_request: {type: string, minLength: 1}
        user_choice: {type: [string, "null"], enum: [ACCEPT, COMPROMISE, REQUEST, null]}
        status: {type: string, enum: [UNREVIEWED, SELECTED, SENT, RESOLVED, KEPT_ORIGINAL]}
      allOf:
        - oneOf:
            - properties:
                source_document_id: {type: string, format: uuid}
                source_page: {type: integer, minimum: 1}
                source_text: {type: string, minLength: 1}
                source_confidence: {type: number, minimum: 0, maximum: 1}
            - properties:
                source_document_id: {type: "null"}
                source_page: {type: "null"}
                source_text: {type: "null"}
                source_confidence: {type: "null"}
        - if:
            properties:
              detection_method: {enum: [MODEL, HYBRID]}
          then:
            properties:
              model_confidence: {type: number}
              model_limitations: {type: string, minLength: 1}
        - if:
            properties:
              detection_method: {const: DETERMINISTIC}
          then:
            properties:
              model_confidence: {type: "null"}
              model_limitations: {type: "null"}
        - if:
            properties:
              basis_type: {const: OFFICIAL_SOURCE}
          then:
            properties:
              basis_citation: {$ref: "#/components/schemas/ReviewBasisCitation"}
        - if:
            properties:
              basis_type: {const: INTERNAL_RULE}
          then:
            properties:
              basis_citation: {type: "null"}
        - if:
            properties:
              verification_status: {const: VERIFIED}
          then:
            properties:
              source_document_id: {type: string, format: uuid}
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
              source_confidence: {type: number, minimum: 0, maximum: 1}
        - if:
            properties:
              verification_status: {enum: [NOT_FOUND, MISSING_EVIDENCE]}
          then:
            properties:
              source_document_id: {type: "null"}
              source_page: {type: "null"}
              source_text: {type: "null"}
              source_confidence: {type: "null"}
        - if:
            properties:
              verification_status: {const: NEEDS_CHECK}
          then:
            properties:
              source_document_id: {type: string, format: uuid}
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
              source_confidence: {type: number, minimum: 0, maximum: 1}
        - if:
            properties:
              status: {const: UNREVIEWED}
          then:
            properties:
              user_choice: {type: "null"}
        - if:
            properties:
              status: {enum: [SELECTED, SENT, RESOLVED, KEPT_ORIGINAL]}
          then:
            properties:
              user_choice: {type: string, enum: [ACCEPT, COMPROMISE, REQUEST]}
        - if:
            properties:
              status: {enum: [SELECTED, SENT, KEPT_ORIGINAL]}
          then:
            properties:
              user_choice: {type: string, enum: [COMPROMISE, REQUEST]}
    Analysis:
      type: object
      additionalProperties: false
      required: [contract_id, extracted_terms, review_items]
      properties:
        contract_id: {type: string, format: uuid}
        extracted_terms:
          type: array
          items: {$ref: "#/components/schemas/ExtractedTerm"}
        review_items:
          type: array
          items: {$ref: "#/components/schemas/ReviewItem"}
    AnalysisStartRequest:
      type: object
      additionalProperties: false
      required: [document_id, supporting_document_ids]
      properties:
        document_id:
          type: string
          format: uuid
          description: 같은 계약에 속하며 type이 CONTRACT인 최신 분석 대상 문서
        supporting_document_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
          description: 같은 계약의 PROPOSAL, ESTIMATE, MESSAGE 문서 ID. 없으면 빈 배열
    AnalysisTask:
      type: object
      additionalProperties: false
      required: [id, contract_id, document_id, supporting_document_ids, status, attempt_count, error_code, result, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        supporting_document_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AnalysisStatus"}
        attempt_count:
          type: integer
          minimum: 0
          maximum: 2
          description: 초기 추출을 1회차로 계산하며, 아직 시작하지 않았으면 0
        error_code:
          type: [string, "null"]
          enum: [DOCUMENT_PARSE_FAILED, ANALYSIS_SCHEMA_INVALID, null]
        result:
          oneOf:
            - {$ref: "#/components/schemas/Analysis"}
            - {type: "null"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              status: {enum: [QUEUED, PROCESSING]}
          then:
            properties:
              error_code: {type: "null"}
              result: {type: "null"}
        - if:
            properties:
              status: {const: PROCESSING}
          then:
            properties:
              attempt_count: {type: integer, minimum: 1, maximum: 2}
        - if:
            properties:
              status: {const: COMPLETED}
          then:
            properties:
              attempt_count: {type: integer, minimum: 1, maximum: 2}
              error_code: {type: "null"}
              result: {$ref: "#/components/schemas/Analysis"}
        - if:
            properties:
              status: {const: FAILED}
          then:
            properties:
              attempt_count: {type: integer, minimum: 1, maximum: 2}
              error_code:
                type: string
                enum: [DOCUMENT_PARSE_FAILED, ANALYSIS_SCHEMA_INVALID]
              result: {type: "null"}
    AnalysisTaskResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AnalysisTask"}
    ReviewItemUpdate:
      type: object
      additionalProperties: false
      required: [user_choice]
      properties:
        user_choice: {type: string, enum: [ACCEPT, COMPROMISE, REQUEST]}
    ReviewItemResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ReviewItem"}
    AdjustmentRequestItem:
      type: object
      additionalProperties: false
      required: [review_item_id, user_choice, request_text]
      properties:
        review_item_id: {type: string, format: uuid}
        user_choice:
          type: string
          enum: [COMPROMISE, REQUEST]
          description: 원안 ACCEPT 항목은 조정 요청에 포함하지 않는다.
        request_text:
          type: string
          minLength: 1
          description: 사용자가 외부 발송 전에 확인할 실제 요청 문구
    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [id, contract_id, status, items, expires_in_hours, sent_at, expires_at, opened_at, responded_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AdjustmentRequestStatus"}
        items:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/AdjustmentRequestItem"}
        expires_in_hours: {type: integer, minimum: 1, maximum: 168}
        sent_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        opened_at: {type: [string, "null"], format: date-time}
        responded_at: {type: [string, "null"], format: date-time}
      allOf:
        - if:
            properties:
              status: {const: DRAFT}
          then:
            properties:
              sent_at: {type: "null"}
              expires_at: {type: "null"}
              opened_at: {type: "null"}
              responded_at: {type: "null"}
        - if:
            properties:
              status: {const: SENT}
          then:
            properties:
              opened_at: {type: "null"}
              responded_at: {type: "null"}
        - if:
            properties:
              status: {const: OPENED}
          then:
            properties:
              responded_at: {type: "null"}
        - if:
            properties:
              status: {const: EXPIRED}
          then:
            properties:
              responded_at: {type: "null"}
        - if:
            properties:
              status: {enum: [SENT, OPENED, RESPONDED, CONFIRMED, EXPIRED]}
          then:
            properties:
              sent_at: {type: string, format: date-time}
              expires_at: {type: string, format: date-time}
        - if:
            properties:
              status: {enum: [OPENED, RESPONDED, CONFIRMED]}
          then:
            properties:
              opened_at: {type: string, format: date-time}
        - if:
            properties:
              status: {enum: [RESPONDED, CONFIRMED]}
          then:
            properties:
              responded_at: {type: string, format: date-time}
    AdjustmentRequestCreate:
      type: object
      additionalProperties: false
      required: [review_item_ids, expires_in_hours]
      properties:
        review_item_ids:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {type: string, format: uuid}
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 168
          description: DRAFT에는 TTL만 저장하며 절대 expires_at은 /send 성공 시 sent_at 기준으로 계산한다.
    ExplicitConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed:
          type: boolean
          const: true
          description: 미리보기를 확인하고 외부 발송을 승인했음을 뜻한다.
    AdjustmentRequestSent:
      type: object
      additionalProperties: false
      required: [id, status, public_url, expires_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, const: SENT}
        public_url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
    AdjustmentRequestSentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AdjustmentRequestSent"}
    AdjustmentRequestResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AdjustmentRequest"}
    PublicAdjustment:
      type: object
      additionalProperties: false
      required: [contract_title, status, expires_at, items]
      properties:
        contract_title: {type: string}
        status:
          type: string
          enum: [SENT, OPENED, RESPONDED, CONFIRMED]
        expires_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [item_id, request_text]
            properties:
              item_id:
                type: string
                description: 공개 요청 범위에서만 유효한 불투명 항목 식별자
              request_text: {type: string}
    PublicAdjustmentResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicAdjustment"}
    PublicAdjustmentOpen:
      type: object
      additionalProperties: false
      required: [status, opened_at]
      properties:
        status: {type: string, const: OPENED}
        opened_at: {type: string, format: date-time}
    PublicAdjustmentOpenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicAdjustmentOpen"}
    AdjustmentResponsesSubmit:
      type: object
      additionalProperties: false
      required: [responses]
      properties:
        responses:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: 공개 요청의 모든 item_id를 빠짐없이 정확히 한 번씩 포함해야 하며 서버가 이를 검증한다.
          items:
            type: object
            additionalProperties: false
            required: [item_id, decision, counter_text, reason]
            properties:
              item_id:
                type: string
                description: 공개 요청 범위에서만 유효한 불투명 항목 식별자
              decision: {type: string, enum: [ACCEPT, REJECT, COUNTER]}
              counter_text: {type: [string, "null"]}
              reason: {type: [string, "null"]}
            allOf:
              - if:
                  properties:
                    decision: {const: ACCEPT}
                then:
                  properties:
                    counter_text: {type: "null"}
                    reason: {type: "null"}
              - if:
                  properties:
                    decision: {const: REJECT}
                then:
                  properties:
                    counter_text: {type: "null"}
                    reason: {type: string, minLength: 1}
              - if:
                  properties:
                    decision: {const: COUNTER}
                then:
                  properties:
                    counter_text: {type: string, minLength: 1}
                    reason: {type: string, minLength: 1}
    AdjustmentResponseItem:
      type: object
      additionalProperties: false
      required: [review_item_id, decision, counter_text, reason]
      properties:
        review_item_id: {type: string, format: uuid}
        decision: {type: string, enum: [ACCEPT, REJECT, COUNTER]}
        counter_text: {type: [string, "null"]}
        reason: {type: [string, "null"]}
      allOf:
        - if:
            properties:
              decision: {const: ACCEPT}
          then:
            properties:
              counter_text: {type: "null"}
              reason: {type: "null"}
        - if:
            properties:
              decision: {const: REJECT}
          then:
            properties:
              counter_text: {type: "null"}
              reason: {type: string, minLength: 1}
        - if:
            properties:
              decision: {const: COUNTER}
          then:
            properties:
              counter_text: {type: string, minLength: 1}
              reason: {type: string, minLength: 1}
    CounterproposalComparison:
      type: object
      additionalProperties: false
      required: [review_item_id, changed_summary, remaining_checks, final_confirmation]
      properties:
        review_item_id: {type: string, format: uuid}
        changed_summary: {type: string, minLength: 1, maxLength: 1200}
        remaining_checks:
          type: array
          maxItems: 6
          items: {type: string, minLength: 1}
        final_confirmation: {type: string, minLength: 1, maxLength: 600}
    OwnerAdjustmentDetail:
      type: object
      additionalProperties: false
      required: [request, responses, comparisons]
      properties:
        request: {$ref: "#/components/schemas/AdjustmentRequest"}
        responses:
          type: array
          items: {$ref: "#/components/schemas/AdjustmentResponseItem"}
        comparisons:
          type: array
          items: {$ref: "#/components/schemas/CounterproposalComparison"}
    OwnerAdjustmentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/OwnerAdjustmentDetail"}
    AdjustmentConfirmation:
      type: object
      additionalProperties: false
      required: [adjustment_request_id, confirmed_items, confirmed]
      properties:
        adjustment_request_id: {type: string, format: uuid}
        confirmed_items:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: 조정 요청의 모든 항목을 빠짐없이 정확히 한 번씩 포함해야 하며 서버가 응답 이력과 대조한다.
          items:
            type: object
            additionalProperties: false
            required: [review_item_id, resolution]
            properties:
              review_item_id: {type: string, format: uuid}
              resolution:
                type: string
                enum: [ACCEPT_REQUEST, ACCEPT_COUNTERPROPOSAL, KEEP_ORIGINAL]
                description: |
                  ACCEPT_REQUEST는 대행사가 수락한 요청 문구, ACCEPT_COUNTERPROPOSAL은
                  대행사가 제시한 역제안 문구만 선택할 수 있다. 최종 문구는 서버가
                  저장된 응답에서 결정하며 클라이언트가 임의로 작성하지 않는다.
        confirmed: {type: boolean, const: true}
    RevisedContractReviewCreate:
      type: object
      additionalProperties: false
      required: [adjustment_request_id, document_id]
      properties:
        adjustment_request_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
    RevisedContractReviewConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed_review_item_ids, confirmed]
      properties:
        confirmed_review_item_ids:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {type: string, format: uuid}
        confirmed: {type: boolean, const: true}
    RevisedContractReviewItem:
      type: object
      additionalProperties: false
      required: [review_item_id, expected_text, match_status, source_page, source_text, confidence, owner_confirmed]
      properties:
        review_item_id: {type: string, format: uuid}
        expected_text: {type: string, minLength: 1}
        match_status: {type: string, enum: [MATCHED, NEEDS_CONFIRMATION]}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"]}
        confidence: {type: [number, "null"], minimum: 0, maximum: 1}
        owner_confirmed: {type: boolean}
    RevisedContractReview:
      type: object
      additionalProperties: false
      required: [id, contract_id, adjustment_request_id, document_id, document_sha256, status, items, created_at, confirmed_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        adjustment_request_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        document_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        status: {type: string, enum: [REVIEW_REQUIRED, CONFIRMED]}
        items:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/RevisedContractReviewItem"}
        created_at: {type: string, format: date-time}
        confirmed_at: {type: [string, "null"], format: date-time}
    RevisedContractReviewResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/RevisedContractReview"}
    PublicSubmission:
      type: object
      additionalProperties: false
      required: [submitted]
      properties:
        submitted: {type: boolean, const: true}
    PublicSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicSubmission"}
    Signature:
      type: object
      additionalProperties: false
      required: [id, contract_id, status, modusign_status, modusign_draft_id, modusign_document_id, last_event_id, requested_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/InternalSignatureStatus"}
        modusign_status:
          oneOf:
            - {$ref: "#/components/schemas/ModusignDocumentStatus"}
            - {type: "null"}
        modusign_draft_id: {type: [string, "null"]}
        modusign_document_id: {type: [string, "null"]}
        last_event_id:
          type: [string, "null"]
          description: vendor 이벤트 ID가 없으면 event.type, document.id, canonical payload hash로 만든 서버 fingerprint
        requested_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
      allOf:
        - if:
            properties:
              status: {const: REQUEST_READY}
          then:
            properties:
              modusign_status: {type: "null"}
              modusign_draft_id: {type: "null"}
              modusign_document_id: {type: "null"}
              last_event_id: {type: "null"}
              requested_at: {type: "null"}
              completed_at: {type: "null"}
        - if:
            properties:
              status: {const: REQUESTING}
          then:
            properties:
              requested_at: {type: string, format: date-time}
              completed_at: {type: "null"}
            oneOf:
              - properties:
                  modusign_status: {type: "null"}
                  modusign_draft_id: {type: "null"}
                  modusign_document_id: {type: "null"}
                  last_event_id: {type: "null"}
              - properties:
                  modusign_status: {type: string, enum: [DRAFT, SCHEDULED, ON_PROCESSING]}
                  modusign_draft_id: {type: "null"}
                  modusign_document_id: {type: string, minLength: 1}
                  last_event_id: {type: [string, "null"], minLength: 1}
        - if:
            properties:
              status: {const: EDITING}
          then:
            properties:
              modusign_status: {const: DRAFT}
              modusign_draft_id: {type: string, minLength: 1}
              modusign_document_id: {type: "null"}
              last_event_id: {type: "null"}
              requested_at: {type: string, format: date-time}
              completed_at: {type: "null"}
        - if:
            properties:
              status: {const: SIGNING}
          then:
            properties:
              modusign_status: {const: ON_GOING}
              modusign_draft_id: {type: [string, "null"]}
              modusign_document_id: {type: string, minLength: 1}
              last_event_id: {type: string, minLength: 1}
              requested_at: {type: string, format: date-time}
              completed_at: {type: "null"}
        - if:
            properties:
              status: {const: COMPLETED}
          then:
            properties:
              modusign_status: {const: COMPLETED}
              modusign_draft_id: {type: [string, "null"]}
              modusign_document_id: {type: string, minLength: 1}
              last_event_id: {type: string, minLength: 1}
              requested_at: {type: string, format: date-time}
              completed_at: {type: string, format: date-time}
        - if:
            properties:
              status: {const: ABORTED}
          then:
            properties:
              modusign_status: {const: ABORTED}
              modusign_draft_id: {type: [string, "null"]}
              modusign_document_id: {type: string, minLength: 1}
              last_event_id: {type: string, minLength: 1}
              requested_at: {type: string, format: date-time}
              completed_at: {type: string, format: date-time}
        - if:
            properties:
              status: {const: FAILED}
          then:
            properties:
              requested_at: {type: string, format: date-time}
              completed_at: {type: string, format: date-time}
            oneOf:
              - properties:
                  modusign_status: {type: "null"}
                  modusign_draft_id: {type: "null"}
                  modusign_document_id: {type: "null"}
                  last_event_id: {type: "null"}
              - properties:
                  modusign_status: {const: PROCESSING_FAILED}
                  modusign_draft_id: {type: [string, "null"]}
                  modusign_document_id: {type: string, minLength: 1}
                  last_event_id: {type: string, minLength: 1}
    SignatureMethod:
      oneOf:
        - $ref: "#/components/schemas/EmailSignatureMethod"
        - $ref: "#/components/schemas/KakaoSignatureMethod"
      discriminator:
        propertyName: type
        mapping:
          EMAIL: "#/components/schemas/EmailSignatureMethod"
          KAKAO: "#/components/schemas/KakaoSignatureMethod"
    EmailSignatureMethod:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: {type: string, const: EMAIL}
        value:
          type: string
          format: email
          description: 응답과 로그에 다시 노출하지 않는 이메일 주소
    KakaoSignatureMethod:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: {type: string, const: KAKAO}
        value:
          type: string
          pattern: "^01[016789][0-9]{7,8}$"
          description: 하이픈을 제외한 국내 휴대전화 번호이며 응답과 로그에 다시 노출하지 않는다.
    Signer:
      type: object
      additionalProperties: false
      required: [role, name, signing_method]
      properties:
        role: {type: string, enum: [OWNER, AGENCY]}
        name: {type: string, minLength: 2, maxLength: 30}
        signing_method: {$ref: "#/components/schemas/SignatureMethod"}
    EmbeddedSignatureDraftCreate:
      type: object
      additionalProperties: false
      required: [signers, confirmed]
      oneOf:
        - required: [revised_contract_review_id]
          not:
            anyOf:
              - required: [agreement_id]
              - required: [agreement_version]
        - required: [agreement_id, agreement_version]
          not:
            required: [revised_contract_review_id]
      properties:
        revised_contract_review_id: {type: string, format: uuid}
        agreement_id:
          type: string
          format: uuid
          deprecated: true
          description: 이전 합의서 기반 서명 재시도를 위한 호환 필드. 새 흐름에서는 사용하지 않는다.
        agreement_version:
          type: integer
          minimum: 1
          deprecated: true
          description: agreement_id와 함께 쓰는 이전 버전 호환 필드
        signers:
          type: array
          minItems: 2
          maxItems: 2
          description: OWNER와 AGENCY를 각각 한 명씩 포함하며 연락처가 중복되면 안 된다.
          items: {$ref: "#/components/schemas/Signer"}
          allOf:
            - contains:
                type: object
                required: [role]
                properties:
                  role: {const: OWNER}
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                required: [role]
                properties:
                  role: {const: AGENCY}
              minContains: 1
              maxContains: 1
        confirmed:
          type: boolean
          const: true
          description: 사용자가 서명자와 확인 완료 수정 계약서를 최종 확인함
    SignatureResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Signature"}
    EmbeddedSignatureDraft:
      type: object
      additionalProperties: false
      required: [signature, editor_url, expires_at]
      properties:
        signature: {$ref: "#/components/schemas/Signature"}
        editor_url:
          type: string
          format: uri
          description: Short-lived Modusign editor URL. Do not store, log, or cache it.
        expires_at: {type: string, format: date-time}
    EmbeddedSignatureDraftResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/EmbeddedSignatureDraft"}
    OriginalContractReference:
      type: object
      additionalProperties: false
      required: [title, signed_date, document_id]
      properties:
        title: {type: string, minLength: 1}
        signed_date: {type: string, format: date}
        document_id: {type: string, format: uuid}
    AgreementConditionSummary:
      type: object
      additionalProperties: false
      required: [term_and_payment, deliverables_and_reporting, termination_and_renewal, rights_safety_and_liability]
      properties:
        term_and_payment:
          type: string
          minLength: 1
          description: 계약기간·총액·결제 일정을 함께 요약하며 미확인 항목은 명시적으로 표시
        deliverables_and_reporting:
          type: string
          minLength: 1
          description: 산출물·광고 채널·보고 방식을 함께 요약하며 미확인 항목은 명시적으로 표시
        termination_and_renewal:
          type: string
          minLength: 1
          description: 해지·환불·자동갱신을 함께 요약하며 미확인 항목은 명시적으로 표시
        rights_safety_and_liability:
          type: string
          minLength: 1
          description: 콘텐츠·계정 권리, 촬영 안전, 시설 파손·손해 책임, 초상권·개인정보를 함께 요약
    Agreement:
      type: object
      additionalProperties: false
      required: [id, version, contract_id, title, original_contract, condition_summary, clauses, unchanged_terms_policy, signature_roles]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        contract_id: {type: string, format: uuid}
        title: {type: string, const: 광고대행 계약조건 변경·확인 합의서}
        original_contract: {$ref: "#/components/schemas/OriginalContractReference"}
        condition_summary: {$ref: "#/components/schemas/AgreementConditionSummary"}
        clauses:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [review_item_id, category, outcome, disposition, before, after, reason]
            properties:
              review_item_id: {type: string, format: uuid}
              category:
                type: string
                enum: [TERM_AND_PAYMENT, DELIVERABLES, TERMINATION_AND_RENEWAL, RIGHTS_AND_SAFETY, OTHER]
              outcome: {type: string, enum: [AGREED, KEPT_ORIGINAL]}
              disposition:
                type: string
                enum: [AGREED, REJECTED, WITHDRAWN]
                description: 합의, 대행사 거절, 소유자 철회를 구분해 원안 유지 이유를 보존
              before: {type: string, minLength: 1}
              after: {type: string, minLength: 1}
              reason: {type: [string, "null"]}
            allOf:
              - if:
                  properties:
                    outcome: {const: AGREED}
                then:
                  properties:
                    disposition: {const: AGREED}
              - if:
                  properties:
                    outcome: {const: KEPT_ORIGINAL}
                then:
                  properties:
                    disposition: {type: string, enum: [REJECTED, WITHDRAWN]}
              - if:
                  properties:
                    disposition: {const: REJECTED}
                then:
                  properties:
                    reason: {type: string, minLength: 1}
        unchanged_terms_policy:
          type: string
          minLength: 1
          description: 합의서에서 변경하지 않은 원계약 조건의 처리 원칙
        signature_roles:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [OWNER, AGENCY]}
          description: 합의서에 포함되는 양측 서명란
    AgreementResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Agreement"}
    ModusignWebhookEvent:
      type: object
      additionalProperties: false
      required: [event, document]
      properties:
        event:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            id:
              type: string
              minLength: 1
              description: 실제 모두싸인 payload에서 제공되고 Adapter가 확인한 경우에만 사용하는 선택 이벤트 ID
            type:
              type: string
              description: 이 endpoint는 아래 P0 이벤트만 구독한다.
              enum:
                - document_started
                - document_signed
                - document_all_signed
                - document_rejected
                - document_request_canceled
                - document_signing_canceled
        document:
          type: object
          additionalProperties: true
          required: [id]
          properties:
            id: {type: string, minLength: 1}
            requester:
              type: object
              additionalProperties: true
              properties:
                email:
                  type: string
                  format: email
                  description: 모두싸인이 전달한 요청자 메타데이터이며 인증에 사용하거나 로그에 남기지 않는다.
    Obligation:
      type: object
      additionalProperties: false
      required: [id, contract_id, title, due_date, assignee, evidence_type, source_document_id, source_page, source_text, confidence, evidence_url, status, submitted_at, reviewed_at, payment_condition_met]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        title:
          type: string
          minLength: 1
          description: 완료 분석에서 제목과 기한이 모두 명확하고 VERIFIED인 첫 번째 대표 산출물
        due_date:
          type: string
          format: date
          description: 대표 산출물과 함께 원문 근거에서 확인된 기한이며 서버가 임의로 만들지 않는다.
        assignee:
          type: string
          const: AGENCY
          description: P0 대표 광고 산출물의 수행·증빙 제출 주체
        evidence_type: {type: string, const: URL}
        source_document_id: {type: string, format: uuid}
        source_page: {type: integer, minimum: 1}
        source_text: {type: string, minLength: 1}
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 제목 구성 필드와 deliverable_due_date를 뒷받침한 VERIFIED 추출값 confidence의 최솟값
        evidence_url:
          type: [string, "null"]
          format: uri
          pattern: "^https?://"
          maxLength: 2048
        status: {$ref: "#/components/schemas/ObligationStatus"}
        submitted_at: {type: [string, "null"], format: date-time}
        reviewed_at: {type: [string, "null"], format: date-time}
        payment_condition_met:
          type: boolean
          description: APPROVED일 때만 true이며 실제 지급 승인이 아님
      allOf:
        - if:
            properties:
              status: {const: PENDING}
          then:
            properties:
              evidence_url: {type: "null"}
              submitted_at: {type: "null"}
              reviewed_at: {type: "null"}
              payment_condition_met: {const: false}
        - if:
            properties:
              status: {const: SUBMITTED}
          then:
            properties:
              evidence_url: {type: string, format: uri, pattern: "^https?://", maxLength: 2048}
              submitted_at: {type: string, format: date-time}
              reviewed_at: {type: "null"}
              payment_condition_met: {const: false}
        - if:
            properties:
              status: {const: APPROVED}
          then:
            properties:
              evidence_url: {type: string, format: uri, pattern: "^https?://", maxLength: 2048}
              submitted_at: {type: string, format: date-time}
              reviewed_at: {type: string, format: date-time}
              payment_condition_met: {const: true}
        - if:
            properties:
              status: {const: DISPUTED}
          then:
            properties:
              evidence_url: {type: string, format: uri, pattern: "^https?://", maxLength: 2048}
              submitted_at: {type: string, format: date-time}
              reviewed_at: {type: string, format: date-time}
              payment_condition_met: {const: false}
    ObligationResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Obligation"}
    ObligationListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              maxItems: 1
              items: {$ref: "#/components/schemas/Obligation"}
    PublicLink:
      type: object
      additionalProperties: false
      required: [public_url, scope, expires_at]
      properties:
        public_url:
          type: string
          format: uri
          description: 생성 응답에서만 반환하고 로그나 이후 조회 응답에 남기지 않는다.
        scope: {type: string, const: OBLIGATION_EVIDENCE}
        expires_at: {type: string, format: date-time}
    PublicLinkCreate:
      type: object
      additionalProperties: false
      required: [expires_in_hours]
      properties:
        expires_in_hours: {type: integer, minimum: 1, maximum: 168}
    PublicLinkResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PublicLink"}
    PerformancePeriod:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      description: 리포트 대상 달력 월(YYYY-MM)
      examples: ["2026-07"]
    PerformanceReportStatus:
      type: string
      enum: [UPLOADED, EXTRACTED, CONFIRMED, FLAGGED]
    PerformanceConfirmedStatus:
      type: string
      enum: [CONFIRMED, FLAGGED]
    PerformanceMetricVerificationStatus:
      type: string
      enum: [VERIFIED, NOT_FOUND, NEEDS_CHECK]
      description: 원문에 명시된 후보, 미탐지 또는 소유자 확인 필요 상태
    PerformanceNonNegativeMetricCandidate:
      type: object
      additionalProperties: false
      required: [value, source_page, source_text, confidence, verification_status]
      properties:
        value: {type: [integer, "null"], minimum: 0}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        verification_status: {$ref: "#/components/schemas/PerformanceMetricVerificationStatus"}
      allOf:
        - if:
            properties:
              verification_status: {const: VERIFIED}
          then:
            properties:
              value: {type: integer, minimum: 0}
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
        - if:
            properties:
              verification_status: {const: NOT_FOUND}
          then:
            properties:
              value: {type: "null"}
              source_page: {type: "null"}
              source_text: {type: "null"}
        - if:
            properties:
              verification_status: {const: NEEDS_CHECK}
          then:
            properties:
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
    PerformanceSignedMetricCandidate:
      type: object
      additionalProperties: false
      required: [value, source_page, source_text, confidence, verification_status]
      properties:
        value: {type: [integer, "null"]}
        source_page: {type: [integer, "null"], minimum: 1}
        source_text: {type: [string, "null"], minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        verification_status: {$ref: "#/components/schemas/PerformanceMetricVerificationStatus"}
      allOf:
        - if:
            properties:
              verification_status: {const: VERIFIED}
          then:
            properties:
              value: {type: integer}
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
        - if:
            properties:
              verification_status: {const: NOT_FOUND}
          then:
            properties:
              value: {type: "null"}
              source_page: {type: "null"}
              source_text: {type: "null"}
        - if:
            properties:
              verification_status: {const: NEEDS_CHECK}
          then:
            properties:
              source_page: {type: integer, minimum: 1}
              source_text: {type: string, minLength: 1}
    PerformanceExtractedPayload:
      type: object
      additionalProperties: false
      required: [impressions, likes, comments, reach, saves, shares, follower_net_change, published_content_count]
      properties:
        impressions: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        likes: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        comments: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        reach: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        saves: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        shares: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
        follower_net_change: {$ref: "#/components/schemas/PerformanceSignedMetricCandidate"}
        published_content_count: {$ref: "#/components/schemas/PerformanceNonNegativeMetricCandidate"}
      description: |
        Upstage·Solar가 만든 strict 후보. 원문에 없는 숫자를 행 수나 URL 수로 추정하지
        않으며 NOT_FOUND 필드도 생략하지 않는다. 확정 전에는 집계·비교에 사용하지 않는다.
    PerformanceConfirmedPayloadInput:
      type: object
      additionalProperties: false
      required: [impressions, likes, comments, reach, saves, shares, follower_net_change, published_content_count, inquiries, reservations, purchases]
      properties:
        impressions: {type: integer, minimum: 0}
        likes: {type: integer, minimum: 0}
        comments: {type: integer, minimum: 0}
        reach: {type: [integer, "null"], minimum: 0}
        saves: {type: [integer, "null"], minimum: 0}
        shares: {type: [integer, "null"], minimum: 0}
        follower_net_change: {type: [integer, "null"]}
        published_content_count: {type: [integer, "null"], minimum: 0}
        inquiries: {type: [integer, "null"], minimum: 0}
        reservations: {type: [integer, "null"], minimum: 0}
        purchases: {type: [integer, "null"], minimum: 0}
      description: 소유자가 확인한 원본 정수 지표. engagement_rate는 서버 파생값이므로 입력할 수 없다.
    PerformanceConfirmedPayload:
      type: object
      additionalProperties: false
      required: [impressions, likes, comments, reach, saves, shares, follower_net_change, published_content_count, inquiries, reservations, purchases]
      properties:
        impressions: {type: integer, minimum: 0}
        likes: {type: integer, minimum: 0}
        comments: {type: integer, minimum: 0}
        reach: {type: [integer, "null"], minimum: 0}
        saves: {type: [integer, "null"], minimum: 0}
        shares: {type: [integer, "null"], minimum: 0}
        follower_net_change: {type: [integer, "null"]}
        published_content_count: {type: [integer, "null"], minimum: 0}
        inquiries: {type: [integer, "null"], minimum: 0}
        reservations: {type: [integer, "null"], minimum: 0}
        purchases: {type: [integer, "null"], minimum: 0}
      description: 소유자가 확정한 원본 정수 지표 snapshot. 서버 파생 반응률은 revision에 분리한다.
    PerformanceReportConfirmation:
      type: object
      additionalProperties: false
      required: [expected_revision, confirmed_payload, has_issue, issue_note, correction_reason]
      properties:
        expected_revision: {type: integer, minimum: 0}
        confirmed_payload: {$ref: "#/components/schemas/PerformanceConfirmedPayloadInput"}
        has_issue: {type: boolean}
        issue_note:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"
        correction_reason:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"
      allOf:
        - if:
            properties:
              has_issue: {const: true}
          then:
            properties:
              issue_note: {type: string, minLength: 1, maxLength: 500, pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"}
          else:
            properties:
              issue_note: {type: "null"}
        - if:
            properties:
              expected_revision: {const: 0}
          then:
            properties:
              correction_reason: {type: "null"}
          else:
            properties:
              correction_reason: {type: string, minLength: 1, maxLength: 500, pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"}
      description: |
        최초 확정은 expected_revision=0과 correction_reason=null, 정정은 현재 version과
        같은 expected_revision 및 비어 있지 않은 correction_reason을 사용한다.
    PerformanceFlagType:
      type: string
      enum: [DELIVERABLE_COUNT_SHORTFALL, ENGAGEMENT_RATE_DROP, OWNER_REPORTED_ISSUE]
    PerformanceFlagBasisSnapshot:
      type: object
      additionalProperties: false
      required: [extracted_term_id, document_id, field, source_type, source_page, source_text, confidence, verification_status]
      properties:
        extracted_term_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        field: {type: string, enum: [content_quantity, posting_frequency]}
        source_type: {type: string, const: CONTRACT_DOCUMENT}
        source_page: {type: integer, minimum: 1}
        source_text: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        verification_status: {type: string, const: VERIFIED}
      description: 같은 계약의 검증된 ExtractedTerm에서 복제한 불변 계약 원문 근거
    PerformanceFlag:
      type: object
      additionalProperties: false
      required: [id, report_revision_id, flag_type, basis_extracted_term_ids, basis_snapshots, comparison_report_revision_id, expected_content_count, expected_period_unit, actual_content_count, previous_engagement_rate, current_engagement_rate, issue_note, created_at]
      properties:
        id: {type: string, format: uuid}
        report_revision_id: {type: string, format: uuid}
        flag_type: {$ref: "#/components/schemas/PerformanceFlagType"}
        basis_extracted_term_ids:
          type: array
          maxItems: 2
          uniqueItems: true
          items: {type: string, format: uuid}
        basis_snapshots:
          type: array
          maxItems: 2
          items: {$ref: "#/components/schemas/PerformanceFlagBasisSnapshot"}
        comparison_report_revision_id: {type: [string, "null"], format: uuid}
        expected_content_count: {type: [integer, "null"], minimum: 0}
        expected_period_unit: {type: [string, "null"], enum: [MONTH, null]}
        actual_content_count: {type: [integer, "null"], minimum: 0}
        previous_engagement_rate:
          type: [number, "null"]
          minimum: 0
          x-decimal-places: 6
        current_engagement_rate:
          type: [number, "null"]
          minimum: 0
          x-decimal-places: 6
        issue_note:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"
        created_at: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              flag_type: {const: DELIVERABLE_COUNT_SHORTFALL}
          then:
            properties:
              basis_extracted_term_ids: {type: array, minItems: 2, maxItems: 2, uniqueItems: true, items: {type: string, format: uuid}}
              basis_snapshots: {type: array, minItems: 2, maxItems: 2, items: {$ref: "#/components/schemas/PerformanceFlagBasisSnapshot"}}
              comparison_report_revision_id: {type: "null"}
              expected_content_count: {type: integer, minimum: 1}
              expected_period_unit: {type: string, const: MONTH}
              actual_content_count: {type: integer, minimum: 0}
              previous_engagement_rate: {type: "null"}
              current_engagement_rate: {type: "null"}
              issue_note: {type: "null"}
        - if:
            properties:
              flag_type: {const: ENGAGEMENT_RATE_DROP}
          then:
            properties:
              basis_extracted_term_ids: {type: array, maxItems: 0}
              basis_snapshots: {type: array, maxItems: 0}
              comparison_report_revision_id: {type: string, format: uuid}
              expected_content_count: {type: "null"}
              expected_period_unit: {type: "null"}
              actual_content_count: {type: "null"}
              previous_engagement_rate: {type: number, exclusiveMinimum: 0}
              current_engagement_rate: {type: number, minimum: 0}
              issue_note: {type: "null"}
        - if:
            properties:
              flag_type: {const: OWNER_REPORTED_ISSUE}
          then:
            properties:
              basis_extracted_term_ids: {type: array, maxItems: 0}
              basis_snapshots: {type: array, maxItems: 0}
              comparison_report_revision_id: {type: "null"}
              expected_content_count: {type: "null"}
              expected_period_unit: {type: "null"}
              actual_content_count: {type: "null"}
              previous_engagement_rate: {type: "null"}
              current_engagement_rate: {type: "null"}
              issue_note: {type: string, minLength: 1, maxLength: 500, pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"}
      description: |
        DELIVERABLE_COUNT_SHORTFALL은 검증된 월 수량 근거가 있고 actual < expected일 때만,
        ENGAGEMENT_RATE_DROP은 달력상 바로 전월의 최신 확정 revision과 같은 saves·shares
        구성을 비교해 양월 impressions >= 1000, 이전 비율 > 0, 반올림 전 절대 하락
        >= 0.01 및 상대 하락 >= 0.25를 동시에 만족할 때만 생성한다.
    PerformanceInquiryDraft:
      type: object
      additionalProperties: false
      description: |
        performance-inquiry-copy-v1의 정확한 템플릿을 렌더링해 저장한 snapshot이다.
        DELIVERABLE_COUNT_SHORTFALL: “{period} 리포트의 게시물 수는 {actual_count}건으로
        기록되어 있습니다. 계약 원문에서 확인한 월 {expected_count}건과 차이가 있어
        해당 월 게시 수와 집계 기준을 확인 부탁드립니다.”
        ENGAGEMENT_RATE_DROP: “{previous_period} 반응률 {previous_rate_percent}%에서
        {period} {current_rate_percent}%로 낮아진 것으로 계산됩니다. 두 달 리포트의
        집계 기준과 변동 사유를 확인 부탁드립니다.”
        OWNER_REPORTED_ISSUE: “{period} 리포트와 관련해 다음 내용을 확인하고 싶습니다:
        {issue_note} 관련 수치와 집계 기준을 확인 부탁드립니다.”
        비율 placeholder는 백분율 소수 2자리, 수량은 10진 정수로 포맷하며 외부로
        자동 발송하지 않는다.
      required: [id, flag_id, text, template_version, created_at]
      properties:
        id: {type: string, format: uuid}
        flag_id: {type: string, format: uuid}
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: 외부 발송하지 않는 복사용 결정적 문의 문안 snapshot
        template_version: {type: string, const: performance-inquiry-copy-v1}
        created_at: {type: string, format: date-time}
    PerformanceReportRevision:
      type: object
      additionalProperties: false
      required: [id, report_id, version, status, confirmed_payload, engagement_rate, corrected_from_revision_id, correction_reason, confirmed_at, flags, inquiry_drafts]
      properties:
        id: {type: string, format: uuid}
        report_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {$ref: "#/components/schemas/PerformanceConfirmedStatus"}
        confirmed_payload: {$ref: "#/components/schemas/PerformanceConfirmedPayload"}
        engagement_rate:
          type: [number, "null"]
          minimum: 0
          x-decimal-places: 6
          description: impressions가 0이면 null, 그 외에는 원본 정수에서 계산한 소수 6자리 ROUND_HALF_UP 값
        corrected_from_revision_id: {type: [string, "null"], format: uuid}
        correction_reason:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"
        confirmed_at: {type: string, format: date-time}
        flags:
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/PerformanceFlag"}
        inquiry_drafts:
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/PerformanceInquiryDraft"}
      allOf:
        - if:
            properties:
              version: {const: 1}
          then:
            properties:
              corrected_from_revision_id: {type: "null"}
              correction_reason: {type: "null"}
          else:
            properties:
              corrected_from_revision_id: {type: string, format: uuid}
              correction_reason: {type: string, minLength: 1, maxLength: 500, pattern: "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]*$"}
        - if:
            properties:
              status: {const: CONFIRMED}
          then:
            properties:
              flags: {type: array, maxItems: 0}
              inquiry_drafts: {type: array, maxItems: 0}
        - if:
            properties:
              status: {const: FLAGGED}
          then:
            properties:
              flags: {type: array, minItems: 1, maxItems: 3, items: {$ref: "#/components/schemas/PerformanceFlag"}}
              inquiry_drafts: {type: array, minItems: 1, maxItems: 3, items: {$ref: "#/components/schemas/PerformanceInquiryDraft"}}
      description: report 안에서 version 오름차순인 append-only 확정 snapshot
    PerformanceReport:
      type: object
      additionalProperties: false
      required: [id, contract_id, period, source_document_id, status, extracted_payload, current_revision, revision_count, revisions, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        contract_id: {type: string, format: uuid}
        period: {$ref: "#/components/schemas/PerformancePeriod"}
        source_document_id:
          type: string
          format: uuid
          description: 같은 계약에 속하고 type=PERFORMANCE_REPORT인 private Document ID
        status: {$ref: "#/components/schemas/PerformanceReportStatus"}
        extracted_payload:
          oneOf:
            - {$ref: "#/components/schemas/PerformanceExtractedPayload"}
            - {type: "null"}
        current_revision:
          oneOf:
            - {$ref: "#/components/schemas/PerformanceReportRevision"}
            - {type: "null"}
        revision_count: {type: integer, minimum: 0}
        revisions:
          type: array
          items: {$ref: "#/components/schemas/PerformanceReportRevision"}
          description: version 오름차순 append-only 이력
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      allOf:
        - if:
            properties:
              status: {const: UPLOADED}
          then:
            properties:
              extracted_payload: {type: "null"}
              current_revision: {type: "null"}
              revision_count: {const: 0}
              revisions: {type: array, maxItems: 0}
        - if:
            properties:
              status: {const: EXTRACTED}
          then:
            properties:
              extracted_payload: {$ref: "#/components/schemas/PerformanceExtractedPayload"}
              current_revision: {type: "null"}
              revision_count: {const: 0}
              revisions: {type: array, maxItems: 0}
        - if:
            properties:
              status: {enum: [CONFIRMED, FLAGGED]}
          then:
            properties:
              extracted_payload: {$ref: "#/components/schemas/PerformanceExtractedPayload"}
              current_revision: {$ref: "#/components/schemas/PerformanceReportRevision"}
              revision_count: {type: integer, minimum: 1}
              revisions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/PerformanceReportRevision"}}
    PerformanceConfirmedSeriesPoint:
      type: object
      additionalProperties: false
      required: [report_id, report_revision_id, period, version, status, confirmed_payload, engagement_rate, confirmed_at]
      properties:
        report_id: {type: string, format: uuid}
        report_revision_id: {type: string, format: uuid}
        period: {$ref: "#/components/schemas/PerformancePeriod"}
        version: {type: integer, minimum: 1}
        status: {$ref: "#/components/schemas/PerformanceConfirmedStatus"}
        confirmed_payload: {$ref: "#/components/schemas/PerformanceConfirmedPayload"}
        engagement_rate:
          type: [number, "null"]
          minimum: 0
          x-decimal-places: 6
        confirmed_at: {type: string, format: date-time}
    ContractPerformance:
      type: object
      additionalProperties: false
      required: [contract_id, reports, confirmed_series, flags, inquiry_drafts]
      properties:
        contract_id: {type: string, format: uuid}
        reports:
          type: array
          items: {$ref: "#/components/schemas/PerformanceReport"}
          description: period 오름차순이며 각 report의 revisions는 version 오름차순
        confirmed_series:
          type: array
          items: {$ref: "#/components/schemas/PerformanceConfirmedSeriesPoint"}
          description: period 오름차순인 각 월의 최신 CONFIRMED 또는 FLAGGED revision만 포함
        flags:
          type: array
          items: {$ref: "#/components/schemas/PerformanceFlag"}
          description: 각 월 최신 revision에 속한 확인 신호만 포함
        inquiry_drafts:
          type: array
          items: {$ref: "#/components/schemas/PerformanceInquiryDraft"}
          description: 최신 revision flag와 연결해 확정 시 저장한 문안 snapshot만 포함
    PerformanceReportCreated:
      allOf:
        - $ref: "#/components/schemas/PerformanceReport"
        - type: object
          properties:
            status: {type: string, const: UPLOADED}
            extracted_payload: {type: "null"}
            current_revision: {type: "null"}
            revision_count: {const: 0}
            revisions: {type: array, maxItems: 0}
      description: createPerformanceReport 최초 201 응답 snapshot
    PerformanceReportExtracted:
      allOf:
        - $ref: "#/components/schemas/PerformanceReport"
        - type: object
          properties:
            status: {type: string, const: EXTRACTED}
            extracted_payload: {$ref: "#/components/schemas/PerformanceExtractedPayload"}
            current_revision: {type: "null"}
            revision_count: {const: 0}
            revisions: {type: array, maxItems: 0}
      description: extractPerformanceReport 최초 200 응답 snapshot
    PerformanceReportConfirmed:
      allOf:
        - $ref: "#/components/schemas/PerformanceReport"
        - type: object
          properties:
            status: {type: string, enum: [CONFIRMED, FLAGGED]}
            extracted_payload: {$ref: "#/components/schemas/PerformanceExtractedPayload"}
            current_revision: {$ref: "#/components/schemas/PerformanceReportRevision"}
            revision_count: {type: integer, minimum: 1}
            revisions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/PerformanceReportRevision"}}
      description: confirmPerformanceReport 최초 200 응답 snapshot
    PerformanceReportResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PerformanceReport"}
    PerformanceReportCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PerformanceReportCreated"}
    PerformanceReportExtractedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PerformanceReportExtracted"}
    PerformanceReportConfirmedResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/PerformanceReportConfirmed"}
    ContractPerformanceResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ContractPerformance"}
    Dashboard:
      type: object
      additionalProperties: false
      required: [total, signing, in_progress, completed, expiring_soon, unresolved_signals, adjustment_requested_clauses, adjustment_agreed_clauses, adjustment_rejected_clauses, obligation_pending, obligation_submitted, obligation_approved, total_committed, payment_condition_met_amount, most_common_signal]
      properties:
        total: {type: integer, minimum: 0}
        signing:
          type: integer
          minimum: 0
          description: Contract.status가 SIGNING인 계약 수
        in_progress:
          type: integer
          minimum: 0
          description: IN_PROGRESS와 RENEWAL_DUE 계약을 합한 수
        completed:
          type: integer
          minimum: 0
          description: Contract.status가 COMPLETED인 계약 수
        expiring_soon:
          type: integer
          minimum: 0
          description: 0≤expiry_d_day≤30, 0≤termination_notice_d_day≤14, 0≤auto_renewal_d_day≤7 중 하나 이상인 distinct 계약 수
        unresolved_signals:
          type: integer
          minimum: 0
          description: ReviewItem.status가 UNREVIEWED, SELECTED, SENT인 항목 수
        adjustment_requested_clauses:
          type: integer
          minimum: 0
          description: DRAFT를 제외하고 실제 발송된 조정 요청 항목 수
        adjustment_agreed_clauses:
          type: integer
          minimum: 0
          description: 최종 확정에서 ACCEPT_REQUEST 또는 ACCEPT_COUNTERPROPOSAL로 확정된 항목 수
        adjustment_rejected_clauses:
          type: integer
          minimum: 0
          description: 대행사 응답이 REJECT이거나 최종 원안 유지로 끝난 distinct 항목 수이며 같은 항목은 한 번만 센다.
        obligation_pending: {type: integer, minimum: 0}
        obligation_submitted: {type: integer, minimum: 0}
        obligation_approved: {type: integer, minimum: 0}
        total_committed:
          type: integer
          format: int64
          minimum: 0
          description: SIGNED, IN_PROGRESS, RENEWAL_DUE, COMPLETED 계약의 non-null canonical total_amount 합계
        payment_condition_met_amount:
          type: integer
          format: int64
          minimum: 0
          description: 대표 Obligation이 APPROVED인 계약의 non-null canonical total_amount 합계. 실제 지급액·지급 승인·법적 이행 판정이 아님
        most_common_signal:
          type: [string, "null"]
          enum: [MISMATCH, NO_BASIS, UNCLEAR, MISSING, NEEDS_CHECK, null]
          description: status가 UNREVIEWED, SELECTED, SENT인 ReviewItem.type 최빈값이며 해당 신호가 없으면 null
    DashboardResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Dashboard"}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Health"}
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, error, requestId]
      properties:
        data: {}
        error: {type: "null"}
        requestId: {type: string, pattern: "^req_[a-f0-9]+$"}
