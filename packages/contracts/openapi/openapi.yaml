          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
  # C-7 API CHANGE (2026-07-31): replaces the template-based, immediate-send
  # endpoint /signature-requests. This endpoint creates only a short-lived
  # Modusign embedded editor draft; the user places fields and sends in the editor.
  /contracts/{contract_id}/signature-embedded-drafts:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    post:
      summary: 모두싸인 임베디드 서명 초안 생성
      operationId: createSignatureEmbeddedDraft
      tags: [signatures]
      description: |
        [C-7 changed] 템플릿을 사용하거나 서명을 즉시 발송하지 않는다. 사용자의
        명시적 확인 후 최신 CONFIRMED 수정 계약서 대조의 문서 ID와 SHA-256을 검증하여
        서명자 기본값과 함께 모두싸인 임베디드 초안을 만든다. 이 API는 PDF를 다시
        렌더링하지 않으며,
        사용자가 반환된 editor_url에서 서명란을 배치한 뒤 직접 발송한다. Contract는
        READY_TO_SIGN을 유지하고 Signature만 EDITING으로 전환한다. editor_url은 2시간
        이내의 민감한 링크이므로 Cache-Control: no-store 응답으로만 반환하며 DB·로그·
        멱등성 재생 결과에 저장하지 않는다. 같은 Idempotency-Key를 재전송하면 URL을
        재발급하지 않고 409을 반환한다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddedSignatureDraftCreate"
      responses:
        "201":
          description: 모두싸인 임베디드 편집 URL 생성
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddedSignatureDraftResponse"
        "409":
          $ref: "#/components/responses/InvalidTransition"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "502": {$ref: "#/components/responses/ModusignRequestFailed"}
  /contracts/{contract_id}/signature:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      summary: 전자서명 상태 조회
      operationId: getSignature
      tags: [signatures]
      description: 재요청 이력이 있으면 가장 최근에 생성된 Signature 한 건을 반환하고 이전 terminal 시도는 감사 이력으로 보존한다.
      responses:
        "200":
          description: 전자서명 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignatureResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
